// 保存用の画像を作る。グリッド線は入力補助用であり、マイソク等の完成図には
// 不要なので、保存(画像)では常に含めず白背景+部屋のみで書き出す。
// マイソク等の完成図には方位が必須(全ペルソナ評価で指摘)。画面上のコンパスUIは
// DOM要素でエクスポート画像に写らないため、保存時だけ別途キャンバスに描き足す。
function drawCompassOnExport(octx, w, h, scale) {
  const r = 20 * scale, cx = w - r - 16 * scale, cy = r + 16 * scale;
  octx.save();
  octx.translate(cx, cy);
  octx.beginPath(); octx.arc(0, 0, r, 0, Math.PI * 2);
  octx.fillStyle = "#ffffff"; octx.fill();
  octx.lineWidth = 1.5 * scale; octx.strokeStyle = "#333"; octx.stroke();
  octx.rotate((state.northAngle || 0) * Math.PI / 180);
  octx.beginPath();
  octx.moveTo(0, -r * 0.8);
  octx.lineTo(r * 0.28, r * 0.35);
  octx.lineTo(0, r * 0.12);
  octx.lineTo(-r * 0.28, r * 0.35);
  octx.closePath();
  octx.fillStyle = "#1c2733"; octx.fill();
  octx.font = `700 ${11 * scale}px -apple-system, sans-serif`;
  octx.textAlign = "center"; octx.textBaseline = "middle";
  octx.fillText("N", 0, -r * 1.05);
  octx.restore();
}

// 建物全体の外形線(外壁)を、各部屋ポリゴンの和集合のシルエットから生成する。
// 部屋ごとのポリゴンをオフスクリーンに黒塗りし、それを8方向×2重に少しずつ
// ずらして重ね描き(=単純な膨張/dilate)することで和集合を太らせ、元のシルエットを
// 「型抜き」して輪っか状にする。厳密なポリゴン結合演算を実装しなくても、
// 隣接・重複する部屋群を覆う一本の外壁線として見せられる(マイソク評価で
// 全ペルソナが指摘した「建物の外形が分からない」への対応)。
// w,hは部屋群の描画領域(drawCanvas相当)のサイズ。外壁は膨張処理で外側にはみ出す
// ため、その分の余白(pad)をあらかじめ確保したオフスクリーンで計算し、はみ出しが
// 画像端でクリップされない(切れない)ようにする。
function drawBuildingOutline(octx, w, h, scale, pad) {
  if (state.rooms.length === 0) return;
  const off = document.createElement("canvas");
  off.width = w + pad * 2; off.height = h + pad * 2;
  const offCtx = off.getContext("2d");
  offCtx.fillStyle = "#1c2733";
  state.rooms.forEach((room) => {
    offCtx.beginPath();
    room.points.forEach((p, i) => {
      const s = gridToScreen(p.gx, p.gy);
      const x = s.x * scale + pad, y = s.y * scale + pad;
      if (i === 0) offCtx.moveTo(x, y); else offCtx.lineTo(x, y);
    });
    offCtx.closePath();
    offCtx.fill();
  });

  const strokeW = Math.max(4, 7 * scale);
  const dilated = document.createElement("canvas");
  dilated.width = off.width; dilated.height = off.height;
  const dctx2 = dilated.getContext("2d");
  const dirs = 20;
  for (let i = 0; i < dirs; i++) {
    const angle = (i / dirs) * Math.PI * 2;
    dctx2.drawImage(off, Math.cos(angle) * strokeW, Math.sin(angle) * strokeW);
  }
  dctx2.globalCompositeOperation = "destination-out";
  dctx2.drawImage(off, 0, 0);
  dctx2.globalCompositeOperation = "source-over";

  octx.drawImage(dilated, 0, 0);
}

// 保存(画像)は、今その瞬間に画面に表示されている範囲だけを切り取るのではなく、
// 建物全体(全部屋のデータ)が必ず収まるようにする。以前は現在のパン/ズーム位置
// によっては建物の一部が画面外に出ていて、その部分がそのまま欠落した状態で
// 保存されてしまう(マイソク用途として致命的な)不具合があったため、保存の
// 瞬間だけ一時的にキャンバスとビューを「全部屋がちょうど収まる表示」に切り替えて
// 描画し、保存が終わったら元の表示状態に戻す。
function buildExportCanvas(scale, transparent) {
  if (state.rooms.length === 0) {
    const empty = document.createElement("canvas");
    empty.width = W * scale; empty.height = H * scale;
    const ectx = empty.getContext("2d");
    if (!transparent) { ectx.fillStyle = "#ffffff"; ectx.fillRect(0, 0, empty.width, empty.height); }
    return empty;
  }

  // 全部屋の実データ範囲(グリッド単位)を求める
  let minGx = Infinity, maxGx = -Infinity, minGy = Infinity, maxGy = -Infinity;
  state.rooms.forEach((room) => room.points.forEach((p) => {
    minGx = Math.min(minGx, p.gx); maxGx = Math.max(maxGx, p.gx);
    minGy = Math.min(minGy, p.gy); maxGy = Math.max(maxGy, p.gy);
  }));
  const marginMasu = 1;
  const contentW = (maxGx - minGx + marginMasu * 2) * BASE_CELL;
  const contentH = (maxGy - minGy + marginMasu * 2) * BASE_CELL;

  // 現在の表示状態を退避
  const savedView = { ...view };
  const savedW = W, savedH = H;
  const savedCanvasW = drawCanvas.width, savedCanvasH = drawCanvas.height;
  const savedCanvasStyleW = drawCanvas.style.width, savedCanvasStyleH = drawCanvas.style.height;

  // 建物全体がちょうど収まる表示に一時的に切り替えて描画する
  view = { scale: 1, offX: (marginMasu - minGx) * BASE_CELL, offY: (marginMasu - minGy) * BASE_CELL };
  W = contentW; H = contentH;
  drawCanvas.width = contentW * scale; drawCanvas.height = contentH * scale;
  drawCanvas.style.width = contentW + "px"; drawCanvas.style.height = contentH + "px";
  dctx.setTransform(scale, 0, 0, scale, 0, 0);
  render();

  // 外壁の膨張(dilate)で外側にはみ出す分の余白
  const pad = Math.max(4, 7 * scale) + 6;
  const out = document.createElement("canvas");
  out.width = contentW * scale + pad * 2; out.height = contentH * scale + pad * 2;
  const octx = out.getContext("2d");
  if (!transparent) { octx.fillStyle = "#ffffff"; octx.fillRect(0, 0, out.width, out.height); }
  drawBuildingOutline(octx, contentW * scale, contentH * scale, scale, pad);
  octx.drawImage(drawCanvas, pad, pad, contentW * scale, contentH * scale);
  drawCompassOnExport(octx, out.width, out.height, scale);

  // 表示状態を元に戻す
  view = savedView; W = savedW; H = savedH;
  drawCanvas.width = savedCanvasW; drawCanvas.height = savedCanvasH;
  drawCanvas.style.width = savedCanvasStyleW; drawCanvas.style.height = savedCanvasStyleH;
  dctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  render();

  return out;
}

// 「全階まとめて保存」用: 同じ物件の全ての階を、それぞれbuildExportCanvasで
// 個別に描画した上で、1枚の画像に縦に並べて結合する。各階は建物の形が違い
// 得るので、幅は一番広い階に合わせて中央寄せし、階ごとに見出し(1F等)を付ける。
// buildExportCanvasはグローバルなstate.rooms/state.northAngleを見て描画する
// ため、階ごとに一時的にstateを差し替えてから呼び出し、最後に元の状態へ戻す。
function buildAllFloorsExportCanvas(scale, transparent) {
  autoSave(); // 今表示中の階の最新状態を確実にlocalStorageへ反映してから読む

  const all = loadAllProjects();
  const proj = all[state.projectName];
  const floorNames = proj && proj.floors ? Object.keys(proj.floors) : [];
  if (floorNames.length === 0) return buildExportCanvas(scale, transparent);

  const savedRooms = state.rooms, savedNorth = state.northAngle, savedFloorName = state.floorName;

  const floorCanvases = floorNames.map((floorName) => {
    const fd = normalizeFloorData(proj.floors[floorName]);
    state.rooms = fd.rooms;
    state.northAngle = fd.northAngle;
    state.floorName = floorName;
    return { floorName, canvas: buildExportCanvas(scale, transparent) };
  });

  state.rooms = savedRooms; state.northAngle = savedNorth; state.floorName = savedFloorName;
  render();

  const labelH = Math.round(28 * scale);
  const gap = Math.round(14 * scale);
  const maxW = Math.max(...floorCanvases.map((f) => f.canvas.width));
  const totalH = floorCanvases.reduce((s, f) => s + labelH + f.canvas.height, 0) + gap * (floorCanvases.length - 1);

  const out = document.createElement("canvas");
  out.width = maxW;
  out.height = totalH;
  const octx = out.getContext("2d");
  if (!transparent) { octx.fillStyle = "#ffffff"; octx.fillRect(0, 0, out.width, out.height); }

  let y = 0;
  floorCanvases.forEach(({ floorName, canvas }, i) => {
    octx.fillStyle = "#1c2733";
    octx.font = `700 ${Math.round(16 * scale)}px -apple-system, sans-serif`;
    octx.textAlign = "left"; octx.textBaseline = "middle";
    octx.fillText(floorName, Math.round(8 * scale), y + labelH / 2);
    y += labelH;
    const x = Math.round((maxW - canvas.width) / 2);
    octx.drawImage(canvas, x, y);
    y += canvas.height;
    if (i < floorCanvases.length - 1) y += gap;
  });

  return out;
}

// data:URLをBlobに変換する(canvas.toDataURLの結果をそのまま使う)。
// canvas.toBlob()は非同期コールバックになり、その頃には「タップした」という
// ブラウザ側の信頼状態(user activation)が切れてダウンロード/共有が
// 効かなくなる端末があるため、あえて同期的なtoDataURL+atobの変換を使う。
function dataUrlToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(",");
  const mimeMatch = header.match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

// このアプリはclaude.aiのArtifactとして表示されることがあり、その場合は
// window.claude.downloads という専用APIでのみファイル保存が確実に効く
// (通常の<a download>やWeb Share APIは埋め込み表示の制約でブロックされることがある)。
// 対応拡張子は現状 png 等の一部形式のみでpdfは非対応のため、まずこちらを試し、
// 使えない/対応していない場合はWeb Share→タップ式ダウンロードの順にフォールバックする。
// タップした直後の「信頼済み操作」の間に同期的に呼び出せるよう、この関数自体は
// asyncにしない(内部でPromiseを使うだけに留める)。
function saveOrShareFile(blob, filename) {
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename, data: blob }).catch((err) => {
      console.error("window.claude.downloads.save failed:", err);
      saveOrShareFileWebFallback(blob, filename);
    });
    return;
  }
  saveOrShareFileWebFallback(blob, filename);
}
function saveOrShareFileWebFallback(blob, filename) {
  if (navigator.canShare && navigator.share) {
    let file = null;
    try { file = new File([blob], filename, { type: blob.type }); } catch { file = null; }
    if (file && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: filename }).catch((err) => {
        if (err && err.name === "AbortError") return; // ユーザーが共有をキャンセルしただけ
        fallbackDownload(blob, filename);
      });
      return;
    }
  }
  fallbackDownload(blob, filename);
}
let downloadReadyUrl = null;
function fallbackDownload(blob, filename) {
  // JSが合成したクリック(link.click())や window.open/location.href は、
  // 埋め込み表示(iframe)の環境によってはブラウザに無視されることがある。

/* ---------------- モーダル表示ヘルパー(重ね表示を避ける) ---------------- */
let modalStack = [];
function showModal(id) {
  // 既に表示中の別モーダルがあれば一旦隠して、閉じたときに元に戻す
  document.querySelectorAll(".modal-overlay.show").forEach((el) => {
    if (el.id !== id) { el.classList.remove("show"); el.classList.add("hidden-behind"); modalStack.push(el.id); }
  });
  $(id).classList.remove("hidden-behind");
  $(id).classList.add("show");
}
function hideModal(id) {
  $(id).classList.remove("show");
  const prev = modalStack.pop();
  if (prev) {
    $(prev).classList.remove("hidden-behind");
    $(prev).classList.add("show");
  }
}

/* ---------------- 保存・物件管理 (Firestore経由。window.Cloudが実体を持つ) ---------------- */
// STORAGE_KEYは現在Firestoreへの移行チェック(migrateLocalDataIfNeeded)でのみ
// 参照される旧キー名。LAST_OPEN_KEYは「最後に開いていた物件/階」という
// 端末固有のUI状態なので、これだけは今まで通りlocalStorageのままにする
// (クラウドに同期する必要が無く、むしろ端末ごとに別々の方が自然なため)。
const STORAGE_KEY = "madori_projects_v2";
const LAST_OPEN_KEY = "madori_last_open_v1";

// これ以降の呼び出し側(約25箇所)は一切変更していない。実体は
// window.Cloud.getCache()/commit()(Firestoreと同期するメモリ上のキャッシュ)
// に差し替わっているが、同期的なインターフェースは変えていない。
function loadAllProjects() {
  return (window.Cloud && window.Cloud.getCache()) || {};
}
function saveAllProjects(data) {
  if (window.Cloud) window.Cloud.commit(data);
}
function saveLastOpen() {
  localStorage.setItem(LAST_OPEN_KEY, JSON.stringify({ project: state.projectName, floor: state.floorName }));
}
function saveCurrentFloorInto(all) {
  if (!all[state.projectName]) all[state.projectName] = { floors: {} };
  // state.roomsは以後もユーザー操作で書き換わり続ける生の配列なので、参照の
  // ままここに入れてはいけない。クラウド同期の差分比較(直前スナップショットと
  // 今回のデータを見比べる)は、比較対象を1.8秒ほど後まで保持するため、参照の
  // ままだと後から描いた部屋が「過去に確定させたはずのスナップショット」side
  // にまで遡って反映されてしまい、差分が常に「変化なし」と誤判定される
  // (実機検証で見つかった不具合)。必ず複製してから保持する。
  all[state.projectName].floors[state.floorName] = { rooms: JSON.parse(JSON.stringify(state.rooms)), northAngle: state.northAngle || 0 };
  return all;
}
// 階データの読み込みヘルパー。旧形式(rooms配列そのもの)と新形式({rooms, northAngle})の両方に対応する。
// 建具の種別も、旧バージョンの"door"/"window"(絵文字アイコン時代)から
// 現行の製図記号種別へマッピングする(そのままだと未知の種別としてFIX窓扱いに
// なってしまい、実際に確認したところ意図しない見た目になっていた)。
function migrateDoorType(type) {
  if (type === "door") return "hinge";
  if (type === "window") return "window_slide";
  return type;
}
// 旧バージョン(壁長に対する比率widthRatioで幅を決めていた頃)のデータを、
// 実寸換算の絶対値widthMasuへ移行する。旧データの見た目をなるべく保つため、
// その壁の当時の長さ×widthRatioをそのままwidthMasuとして引き継ぐ。
function migrateDoorWidth(d, roomPoints) {
  if (typeof d.widthMasu === "number") return d.widthMasu;
  const p1 = roomPoints[d.edge], p2 = roomPoints[(d.edge + 1) % roomPoints.length];
  const edgeLenMasu = (p1 && p2) ? Math.hypot(p2.gx - p1.gx, p2.gy - p1.gy) : 1;
  const legacyRatio = typeof d.widthRatio === "number" ? d.widthRatio : 0.3;
  return Math.max(0.3, Math.round(edgeLenMasu * legacyRatio * 10) / 10);
}
function normalizeFloorData(raw) {
  const data = Array.isArray(raw) ? { rooms: raw, northAngle: 0 } : { rooms: (raw && raw.rooms) || [], northAngle: (raw && raw.northAngle) || 0 };
  data.rooms = data.rooms.map((r) => ({
    ...r,
    doors: (r.doors || []).map((d) => ({ ...d, type: migrateDoorType(d.type), widthMasu: migrateDoorWidth(d, r.points) })),
  }));
  return data;
}
// オートセーブ: 部屋の追加・削除・編集・建具変更のたびに自動保存する。
// ただし、まだ一度も保存されたことのない物件(=部屋を1つも描いていない
// 初期状態)は保存しない。そうしないと「物件一覧を開いただけ」のような
// 閲覧操作でも空の「無題の物件」が永続化されてしまい、一覧に消えない
// ゴースト物件として残り続ける不具合になる。
function autoSave() {
  const all = loadAllProjects();
  if (!all[state.projectName] && state.rooms.length === 0) return;
  saveCurrentFloorInto(all);
  saveAllProjects(all);
  saveLastOpen();
}

// 階段は1階だけで完結する部屋ではなく、上下階を実際に繋ぐものなので、ある階で
// 階段を描いたら他の階にも同じ形をそのまま複製する(逆に位置がずれたまま放置
// されて「実は繋がっていない階段」になる問題を防ぐ)。room.stairIdで階をまたいで
// 同一の階段だと紐付け、無ければ新規発行する。
// 他の階に複製する際の階段部屋オブジェクトを作る共通処理(建具は複製しない=
// 階ごとに個別に付け直す想定)。既存の複製を上書きする場合はexistingIdを渡す。
function makeStairCopy(sourceRoom, existingId) {
  return {
    id: existingId != null ? existingId : Date.now() + Math.random(),
    points: sourceRoom.points.map((p) => ({ ...p })),
    typeKey: "kaidan",
    tatami: sourceRoom.tatami,
    stepCount: sourceRoom.stepCount || DEFAULT_STEP_COUNT,
    stairId: sourceRoom.stairId,
    doors: [],
  };
}
function syncStairToOtherFloors(room) {
  if (room.typeKey !== "kaidan") return;
  if (!room.stairId) room.stairId = `stair_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  const all = loadAllProjects();
  const proj = all[state.projectName];
  if (!proj || !proj.floors) return;
  Object.keys(proj.floors).forEach((floorName) => {
    if (floorName === state.floorName) return;
    const fd = normalizeFloorData(proj.floors[floorName]);
    const idx = fd.rooms.findIndex((r) => r.stairId === room.stairId);
    const copy = makeStairCopy(room, idx >= 0 ? fd.rooms[idx].id : null);
    if (idx >= 0) fd.rooms[idx] = copy; else fd.rooms.push(copy);
    proj.floors[floorName] = fd;
  });
  saveAllProjects(all);
}

// 方位(北の向き)は建物全体で共通のはずなので、ある階でコンパスを回したら
// 他の全ての階にも同じ角度を反映する(階段の自動連動と同じ考え方)。
// 新規階作成時に現在の角度を引き継ぐだけでは、後から別の階で方位を直した時に
// 他の階だけ古い角度のまま取り残されてしまうため、変更のたびに同期する。
function syncNorthAngleToOtherFloors() {
  const all = loadAllProjects();
  const proj = all[state.projectName];
  if (!proj || !proj.floors) return;
  let changed = false;
  Object.keys(proj.floors).forEach((floorName) => {
    if (floorName === state.floorName) return;
    const fd = normalizeFloorData(proj.floors[floorName]);
    if (fd.northAngle !== state.northAngle) {
      fd.northAngle = state.northAngle;
      proj.floors[floorName] = fd;
      changed = true;
    }
  });
  if (changed) saveAllProjects(all);
}

// 階段を削除したら、他の階に複製されている分も一緒に削除する
function removeStairFromOtherFloors(stairId) {
  if (!stairId) return;
  const all = loadAllProjects();
  const proj = all[state.projectName];
  if (!proj || !proj.floors) return;
  Object.keys(proj.floors).forEach((floorName) => {
    if (floorName === state.floorName) return;
    const fd = normalizeFloorData(proj.floors[floorName]);
    fd.rooms = fd.rooms.filter((r) => r.stairId !== stairId);
    proj.floors[floorName] = fd;
  });
  saveAllProjects(all);
}

// 物件一覧のサムネイル: 1階分の間取りを小さく単純化して描く(文字・建具・階段記号は
// 省略し、部屋の形と色だけの簡易版)。一覧に何件並んでも重くならないよう、
// 通常のbuildExportCanvasは使わず、専用の軽量な描画にしている。
function buildThumbnailDataUrl(floorData, size) {
  const rooms = (floorData && floorData.rooms) || [];
  if (rooms.length === 0) return null;
  let minGx = Infinity, maxGx = -Infinity, minGy = Infinity, maxGy = -Infinity;
  rooms.forEach((r) => r.points.forEach((p) => {
    minGx = Math.min(minGx, p.gx); maxGx = Math.max(maxGx, p.gx);
    minGy = Math.min(minGy, p.gy); maxGy = Math.max(maxGy, p.gy);
  }));
  const w = maxGx - minGx, h = maxGy - minGy;
  if (!(w > 0) || !(h > 0)) return null;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, size, size);
  const pad = size * 0.08;
  const scale = Math.min((size - pad * 2) / w, (size - pad * 2) / h);
  const offX = (size - w * scale) / 2, offY = (size - h * scale) / 2;
  const toPx = (p) => ({ x: (p.gx - minGx) * scale + offX, y: (p.gy - minGy) * scale + offY });
  rooms.forEach((r) => {
    const type = ROOM_TYPES.find((t) => t.key === r.typeKey) || ROOM_TYPES[ROOM_TYPES.length - 1];
    ctx.beginPath();
    r.points.forEach((p, i) => {
      const s = toPx(p);
      if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
    });
    ctx.closePath();
    ctx.fillStyle = type.color;
    ctx.fill();
    ctx.strokeStyle = type.stroke;
    ctx.lineWidth = 1;
    ctx.stroke();
  });
  return canvas.toDataURL("image/png");
}

function renderProjectList(filterText) {
  const all = loadAllProjects();
  const list = $("projectList"); list.innerHTML = "";
  const q = (filterText || "").trim().toLowerCase();
  // 名前の五十音・アルファベット順に並べ、多数の物件から目的のものを探しやすくする
  const names = Object.keys(all)
    .filter((name) => !q || name.toLowerCase().includes(q))
    .sort((a, b) => a.localeCompare(b, "ja"));
  if (Object.keys(all).length === 0) {
    list.innerHTML = `<p style="color:#7c8996;font-size:13px;">保存された物件はまだありません</p>`;
  } else if (names.length === 0) {
    list.innerHTML = `<p style="color:#7c8996;font-size:13px;">「${filterText}」に一致する物件が見つかりません</p>`;
  }
  names.forEach((name) => {
    const floors = Object.keys(all[name].floors || {});
    const row = document.createElement("div");
    row.className = "project-item";
    const firstFloorData = floors.length ? normalizeFloorData(all[name].floors[floors[0]]) : { rooms: [] };
    const thumbUrl = buildThumbnailDataUrl(firstFloorData, 56);
    const thumbHtml = thumbUrl
      ? `<img src="${thumbUrl}" alt="">`
      : `<span class="thumb-empty">🏠</span>`;
    row.innerHTML = `<div class="thumb">${thumbHtml}</div><div class="meta"><div class="name">${name}</div><div class="sub">${floors.length}階分保存済み</div></div>`;
    const openBtn = document.createElement("button");
    openBtn.textContent = "開く";
    openBtn.addEventListener("click", () => {
      state.projectName = name;
      const firstFloor = floors[0] || "1F";
      state.floorName = firstFloor;
      openFloorIntoState(normalizeFloorData(all[name].floors[firstFloor]), "projectsModal");
    });
    const renameBtn = document.createElement("button");
    renameBtn.textContent = "名前変更";
    renameBtn.addEventListener("click", () => {
      openTextInput("物件名を編集", name, (v) => {
        renameProjectInStorage(name, v);
        renderProjectList($("projectSearchInput").value);
      }, projectNameValidator(name));
    });
    const delBtn = document.createElement("button");
    delBtn.textContent = "削除"; delBtn.style.color = "#e2492c";
    delBtn.addEventListener("click", () => {
      openConfirm("物件を削除", `「${name}」を削除しますか？`, () => {
        delete all[name]; saveAllProjects(all); renderProjectList($("projectSearchInput").value);
      });
    });
    row.appendChild(openBtn); row.appendChild(renameBtn); row.appendChild(delBtn);
    list.appendChild(row);
  });
}

    if (proj && proj.floors) {
      Object.values(proj.floors).forEach((raw) => {
        normalizeFloorData(raw).rooms.forEach((r) => {
          if (r.typeKey === "kaidan" && r.stairId && !stairsById.has(r.stairId)) stairsById.set(r.stairId, r);
        });
      });
    }
    const rooms = Array.from(stairsById.values()).map((r) => makeStairCopy(r, null));
    // 北の向き(northAngle)は建物共通なので引き継ぐ
    openFloorIntoState({ rooms, northAngle: state.northAngle }, "floorModal");
  }, (name) => {
    const all = loadAllProjects();
    const proj = all[state.projectName];
    if (proj && proj.floors && proj.floors[name]) return `「${name}」という階は既にあります`;
    return null;
  });
});

document.querySelectorAll(".modal-overlay").forEach((ov) => {
  ov.addEventListener("click", (e) => {
    if (e.target !== ov) return;
    // 畳数編集モーダルは明示的な「キャンセル」ボタンが無く、既存部屋の編集中に
    // 背景タップで閉じると入力した畳数が無言で破棄されてしまう(実測で確認された
    // 問題)。既存部屋の編集中に限り、背景タップも「これで確定」と同じ扱いにする。
    if (ov.id === "tatamiModal" && editingRoom) { confirmTatami(); return; }
    ov.classList.remove("show");
    modalStack = modalStack.filter((id) => id !== ov.id);
  });
});

/* ---------------- 起動時: 前回開いていた物件/階を復元 ---------------- */
function restoreLastOpen() {
  try {
    const last = JSON.parse(localStorage.getItem(LAST_OPEN_KEY));
    if (!last) return;
    const all = loadAllProjects();
    const proj = all[last.project];
    if (!proj || !proj.floors || !proj.floors[last.floor]) return;
    state.projectName = last.project;
    state.floorName = last.floor;
    const fd = normalizeFloorData(proj.floors[last.floor]);
    state.rooms = fd.rooms; state.northAngle = fd.northAngle;
  } catch { /* 復元できなければ初期状態のまま */ }
}
window.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autoSave(); });
window.addEventListener("beforeunload", autoSave);

/* ---------------- ログイン画面(Firebase Auth) ---------------- */
// #app内に無い(=#appを隠すだけでは連動して隠れない)全画面固定要素を
// まとめて隠す。ログアウト時、開きっぱなしのモーダルが残ってしまうのを防ぐ。
function hideAllModalsAndBanners() {
  document.querySelectorAll(".modal-overlay.show, .modal-overlay.hidden-behind").forEach((el) => {
    if (el.id === "loginGate") return;
    el.classList.remove("show", "hidden-behind");
  });
  modalStack = [];
  const banner = $("downloadReadyBanner");
  if (banner) banner.style.display = "none";
}
function showAppUI() {
  $("loginGate").classList.remove("show");
  $("app").classList.remove("app-hidden");
}
function hideAppUI() {
  hideAllModalsAndBanners();
  $("app").classList.add("app-hidden");
  $("loginGate").classList.add("show");
  setLoginMode("login");
  $("loginEmail").value = ""; $("loginPassword").value = "";
}
function showLoginError(err) {
  $("loginError").textContent = (window.Cloud && window.Cloud.mapAuthError(err)) || "ログインに失敗しました。もう一度お試しください";
}
// ログイン画面は「ログイン」「新規登録」を別画面のように切り替える(実体は同じ
// メール/パスワード欄を使い回す1画面だが、見出し・ボタン・案内リンクを
// 丸ごと入れ替えることで、別ページに遷移したように見せる)。
let loginMode = "login";
function setLoginMode(mode) {
  loginMode = mode;
  $("loginError").textContent = "";
  if (mode === "signup") {
    $("loginModeTitle").textContent = "新規登録";
    $("loginModeSub").textContent = "メールアドレスとパスワードを決めて登録してください";
    $("btnLoginSubmit").textContent = "新規登録";
    $("btnToggleLoginMode").textContent = "すでにアカウントをお持ちの方はこちら（ログイン）";
    $("btnForgotPassword").style.display = "none";
  } else {
    $("loginModeTitle").textContent = "ログイン";
    $("loginModeSub").textContent = "続けるにはログインしてください";
    $("btnLoginSubmit").textContent = "ログイン";
    $("btnToggleLoginMode").textContent = "アカウントをお持ちでない方はこちら（新規登録）";
    $("btnForgotPassword").style.display = "";
  }
}
$("btnToggleLoginMode").addEventListener("click", () => setLoginMode(loginMode === "login" ? "signup" : "login"));
$("btnLoginSubmit").addEventListener("click", async () => {
  if (!window.Cloud) return;
  $("loginError").textContent = "";
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  try {
    if (loginMode === "signup") await window.Cloud.signUpEmail(email, password);
    else await window.Cloud.signInEmail(email, password);
  } catch (err) { showLoginError(err); }
});
// ポップアップブロッカー対策のため、awaitを挟まず同期的に呼び出す
$("btnGoogleSignIn").addEventListener("click", () => {
  if (!window.Cloud) return;
  $("loginError").textContent = "";
  window.Cloud.signInGoogle().catch((err) => showLoginError(err));
});
$("btnLogout").addEventListener("click", () => {
  if (!window.Cloud) return;
  openConfirm("ログアウト", "ログアウトしますか？", () => window.Cloud.signOutUser());
});
$("btnForgotPassword").addEventListener("click", async () => {
  if (!window.Cloud) return;
  $("loginError").textContent = "";
  const email = $("loginEmail").value.trim();
  if (!email) { $("loginError").textContent = "メールアドレスを入力してください"; return; }
  try {
    await window.Cloud.resetPassword(email);
    showHint("パスワード再設定用のメールを送信しました。届いたメールの案内に従って再設定してください", true);
  } catch (err) {
    showLoginError(err);
  }
});

// type="module"のFirebase初期化スクリプトは常に本体scriptより後に実行される
// (moduleは常に遅延実行のため)。そのためwindow.Cloudが定義済みとは限らず、
// "cloud-ready"イベントで完了を待ち合わせる。
function whenCloudReady(fn) {
  if (window.Cloud) { fn(); return; }
  window.addEventListener("cloud-ready", fn, { once: true });
}

/* ---------------- 初期化 ---------------- */
// resize()はcanvasWrapの実寸(clientWidth/Height)を読むため、#appがdisplay:none
// (未ログイン)の間に呼ぶと0×0になってしまう。ログインして#appを表示した
// "後"に呼ぶ必要があるため、ここでは呼ばずonReadyのコールバック内で行う。
whenCloudReady(() => {
  window.Cloud.onReady(async (user) => {
    if (!user) { hideAppUI(); return; }
    showAppUI();
    resize();
    updateUndoRedoButtons();
    updateCompassVisual();
    try {
      await window.Cloud.loadAllProjectsFromCloud(user.uid);
    } catch (err) {
      console.error("物件データの取得に失敗しました:", err);
      if (!navigator.onLine) {
        showHint("オフラインのため前回のデータを表示できません。電波の良い場所で一度ログインし直してください", true);
      } else {
        showHint("データの取得に失敗しました。時間をおいて再度お試しください", true);
      }
    }
    window.Cloud.migrateLocalDataIfNeeded(); // ユーザーの回答を待たず先に進める
    restoreLastOpen();
    render();
    showHint("何もない場所は指でなぞって部屋を描けます。部屋の中をタップすると選択して編集できます", true);
  });
});
</script>
