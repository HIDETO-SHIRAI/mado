         戻ると部屋が閉じる。2本指でズーム/パン。
   ============================================================ */

const BASE_CELL = 56; // 1マスの基準ピクセルサイズ(zoom=1のとき)
const MASU_PER_TATAMI = 2; // 2マス = 1畳（ユーザー指定）
const CLOSE_DIST_PX = 26; // 始点に戻ったとみなす画面上の許容距離(px)
const AXIS_THRESHOLD_PX = 16; // なぞり描きで軸(水平/垂直)を判定する最小移動量
const DOOR_HIT_RADIUS_PX = 16; // 既存建具をタップ選択する許容半径
const FIXTURE_HIT_RADIUS_PX = 22; // トイレ等の設備アイコンをドラッグ開始するタップ許容半径
const MIN_RATIO_GAP = 0.12; // 同一壁上で建具同士が近づける最小のratio差

// 配色モード: "color"=部屋種別ごとに色分け(既定)、"simple"=WebCAD等の実例に
// 近い、全室を単色(クリーム系)にして線とハッチング・アイコンだけで区別する
// マイソク向けの落ち着いた配色。設定はブラウザに保存し次回も引き継ぐ。
let colorScheme = localStorage.getItem("madori_color_scheme_v1") || "color";
const SIMPLE_FILL = "#fdfbf7";
const SIMPLE_STROKE = "#3a3a3a";
function setColorScheme(mode) {
  colorScheme = mode;
  localStorage.setItem("madori_color_scheme_v1", mode);
}

const ROOM_TYPES = [
  { key: "youshitsu", label: "洋室", em: "🛏️", color: "#eaf1ff", stroke: "#7fa6f0" },
  { key: "ldk", label: "LDK", em: "🍽️", color: "#fff3e0", stroke: "#f0b26a" },
  { key: "kitchen", label: "キッチン", em: "🍳", color: "#fff8e1", stroke: "#e0a95f" },
  { key: "washitsu", label: "和室", em: "🎎", color: "#f1f8e9", stroke: "#9ccf6a" },
  { key: "genkan", label: "玄関", em: "🚪", color: "#f5f0ff", stroke: "#b39ddb" },
  { key: "rouka", label: "廊下", em: "🚶", color: "#f4f4f2", stroke: "#b7bcc2", noLabel: true },
  { key: "wc", label: "トイレ", em: "🚽", color: "#e0f7fa", stroke: "#4dd0e1" },
  { key: "yokushitsu", label: "浴室", em: "🛁", color: "#e1f5fe", stroke: "#4fc3f7" },
  { key: "senmen", label: "洗面所", em: "🚰", color: "#e8f5e9", stroke: "#81c784" },
  { key: "oshiire", label: "押入", em: "📦", color: "#fdf6e3", stroke: "#d6c26a" },
  { key: "shuno", label: "収納", em: "🗄️", color: "#f5f0e3", stroke: "#c9a96a" },
  { key: "wic", label: "WIC", em: "👚", color: "#f3ecf8", stroke: "#a985c9" },
  { key: "kaidan", label: "階段", em: "🪜", color: "#eef1f4", stroke: "#8b96a3" },
  { key: "ut", label: "UT", em: "🧺", color: "#e9f4f5", stroke: "#6bb0b8" },
  { key: "sonota", label: "その他", em: "▫️", color: "#f0f0f0", stroke: "#b0b0b0" },
];
// 建具種別: 絵文字ではなく建築製図に準じた線記号(円弧・平行線)で描画する。
// hinge系は開き戸(円弧+扉本体)、slide系は引き戸(平行線)、window系は窓(サッシ線)。
// defaultWidthMasu: 実際の建具規格(調査済み)を1マス=910mm換算したおおよその
// 既定幅。壁の長さに対する比率ではなく、この絶対値(マス単位)を基準に使う。
const DOOR_TYPES = [
  { key: "hinge", label: "片開き戸", group: "door", defaultWidthMasu: 0.85 },
  { key: "hinge_double", label: "両開き戸", group: "door", defaultWidthMasu: 1.8 },
  { key: "slide", label: "片引き戸", group: "door", defaultWidthMasu: 0.9 },
  { key: "slide_double", label: "引き違い戸", group: "door", defaultWidthMasu: 1.85 },
  { key: "window_slide", label: "引き違い窓", group: "window", defaultWidthMasu: 1.85 },
  { key: "window_fix", label: "FIX窓", group: "window", defaultWidthMasu: 0.9 },
];
function defaultWidthMasuForType(key) {
  const t = DOOR_TYPES.find((x) => x.key === key);
  return (t && t.defaultWidthMasu) || 0.85;
}

const $ = (id) => document.getElementById(id);
const gridCanvas = $("grid");
const drawCanvas = $("draw");
const wrap = $("canvasWrap");
const gctx = gridCanvas.getContext("2d");
const dctx = drawCanvas.getContext("2d");

let W = 0, H = 0;

/* ---------------- ビュー変換(パン・ズーム) ---------------- */
let view = { scale: 1, offX: 0, offY: 0 };

function cell() { return BASE_CELL * view.scale; }
function screenToWorld(px, py) { return { x: (px - view.offX) / view.scale, y: (py - view.offY) / view.scale }; }
function worldToScreen(x, y) { return { x: x * view.scale + view.offX, y: y * view.scale + view.offY }; }
// 点を置く細かさ(1マスの何分の1刻みでスナップするか)。1=マスの角のみ、8=1/8刻み。
const SNAP_DENOMS = [1, 2, 3, 4, 6, 8];
let snapDenom = Number(localStorage.getItem("madori_snap_denom_v1")) || 1;
if (!SNAP_DENOMS.includes(snapDenom)) snapDenom = 1;
function setSnapDenom(d) {
  snapDenom = d;
  localStorage.setItem("madori_snap_denom_v1", String(d));
}
function snapCoord(v) { return Math.round(v * snapDenom) / snapDenom; }

function screenToGridRaw(px, py) { const w = screenToWorld(px, py); return { gx: w.x / BASE_CELL, gy: w.y / BASE_CELL }; }
function screenToGridSnapped(px, py) { const r = screenToGridRaw(px, py); return { gx: snapCoord(r.gx), gy: snapCoord(r.gy) }; }
function gridToScreen(gx, gy) { return worldToScreen(gx * BASE_CELL, gy * BASE_CELL); }

function resize() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  [gridCanvas, drawCanvas].forEach((c) => {
    c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
    c.style.width = W + "px"; c.style.height = H + "px";
    c.getContext("2d").setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  });
  drawGrid(); render();
}
window.addEventListener("resize", resize);

function drawGrid() {
  gctx.clearRect(0, 0, W, H);
  const c = cell();
  const startGX = Math.floor((-view.offX) / c) - 1;
  const endGX = Math.ceil((W - view.offX) / c) + 1;
  const startGY = Math.floor((-view.offY) / c) - 1;
  const endGY = Math.ceil((H - view.offY) / c) + 1;
  gctx.lineWidth = 1;
  for (let i = startGX; i <= endGX; i++) {
    const { x } = gridToScreen(i, 0);
    gctx.strokeStyle = i % 5 === 0 ? "#a9bcd1" : "#dbe4ec";
    gctx.beginPath(); gctx.moveTo(Math.round(x) + 0.5, 0); gctx.lineTo(Math.round(x) + 0.5, H); gctx.stroke();
  }
  for (let j = startGY; j <= endGY; j++) {
    const { y } = gridToScreen(0, j);
    gctx.strokeStyle = j % 5 === 0 ? "#a9bcd1" : "#dbe4ec";
    gctx.beginPath(); gctx.moveTo(0, Math.round(y) + 0.5); gctx.lineTo(W, Math.round(y) + 0.5); gctx.stroke();
  }
}

/* ---------------- 状態管理 ---------------- */
let state = { projectName: "無題の物件", floorName: "1F", rooms: [], northAngle: 0 };
// room: {id, points:[{gx,gy}], typeKey, tatami, doors:[{edge, ratio, type, flip}]}
// northAngle: 方位マークの回転角(度, 0=画面の真上が北)。図面(壁・部屋の座標)は
// 回転させず、マークの向きだけを保持する(マイソクの「矢印=北」慣習に合わせる)

let currentTool = "wall"; // wall | door | erase
let drawingPoints = [];
let previewPoint = null; // なぞり描き中の現在候補点
let isPointerDrawing = false;
let dragAxis = null; // 'x' | 'y' | null (なぞり描き中の確定軸)
let lastRawPos = null; // {x,y} 直近に方向判定を行った、生の(丸めていない)ポインタ位置
let pendingRoom = null;
let editingRoom = null; // 編集(既存部屋タップ)で選択中の部屋。ハンドル表示の対象にもなる
let pendingDoor = null; // {room, edge, ratio, existingIndex}
// 直前に新規追加した建具の種類・大きさ・向き。同じ種類を連続して付けたい場面が
// 多いため、次に新規で建具を付ける時の初期値として引き継ぐ。ページ再訪問時にも
// 引き継げるよう、localStorageにも保存しておく(新規セッションの最初の1個目から
// 前回使った種類が初期選択された状態にするため)。
const LAST_DOOR_PREF_KEY = "madori_last_door_pref_v1";
function loadLastDoorPref() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAST_DOOR_PREF_KEY));
    if (saved && saved.type) return saved;
  } catch { /* 保存値が壊れていれば既定値にフォールバック */ }
  return { type: "hinge", widthMasu: defaultWidthMasuForType("hinge"), flip: false };
}
function saveLastDoorPref() {
  localStorage.setItem(LAST_DOOR_PREF_KEY, JSON.stringify({ type: lastDoorType, widthMasu: lastDoorWidthMasu, flip: lastDoorFlip }));
}
const initialDoorPref = loadLastDoorPref();
let lastDoorType = initialDoorPref.type;
let lastDoorWidthMasu = initialDoorPref.widthMasu || defaultWidthMasuForType(initialDoorPref.type);
let lastDoorFlip = initialDoorPref.flip;
let vertexDrag = null; // {room, index} 頂点ハンドルをドラッグ中の状態
let fixtureDrag = null; // {room} トイレ等の設備アイコンをドラッグ中の状態
let fixtureRotateDrag = null; // {room} 設備アイコンの回転ハンドルをドラッグ中の状態
let doorDrag = null; // {room, doorIndex, moved} 既存建具をドラッグして壁沿いに移動中の状態

let history = [], future = [];
function snapshot() {
  history.push(JSON.stringify(state.rooms));
  if (history.length > 50) history.shift();
  future = [];
  updateUndoRedoButtons();
}
function undo() {
  if (!history.length) return;
  future.push(JSON.stringify(state.rooms));
  state.rooms = JSON.parse(history.pop());
  render(); updateUndoRedoButtons(); autoSave();
}
function redo() {
  if (!future.length) return;
  history.push(JSON.stringify(state.rooms));
  state.rooms = JSON.parse(future.pop());
  render(); updateUndoRedoButtons(); autoSave();
}
function updateUndoRedoButtons() {
  $("btnUndo").disabled = history.length === 0;
  $("btnRedo").disabled = future.length === 0;
}

// なぞり描き・タップでの作図では、間違えて壁を伸ばしすぎてから戻す、といった
// 操作の結果、実際の部屋の「角」ではない余分な頂点(一直線上に並ぶだけの点、
// または行き過ぎて折り返しただけのスパイク状の点)が紛れ込むことがある。
// 部屋を確定する直前にこれらを自動的に取り除き、意図した形だけが残るようにする。
// 3点が一直線上(180度)でも、行き過ぎて折り返した形(0度=スパイク)でも、
// 外積(cross)がほぼ0になる点は共通しているため、どちらも同じ判定で除去できる。
function simplifyRoomPoints(points) {
  const EPS = 1e-6;
  // 1) ほぼ同一座標の連続する重複点を除去
  let pts = [];
  for (const p of points) {
    const prev = pts[pts.length - 1];
    if (!prev || Math.hypot(p.gx - prev.gx, p.gy - prev.gy) > EPS) pts.push(p);
  }
  if (pts.length > 1) {
    const first = pts[0], last = pts[pts.length - 1];
    if (Math.hypot(first.gx - last.gx, first.gy - last.gy) < EPS) pts.pop();
  }
  if (pts.length <= 3) return pts;

  // 2) 隣接2辺がほぼ一直線(180度、またはスパイクの0度)になる頂点を繰り返し除去
  let changed = true;
  while (changed && pts.length > 3) {
    changed = false;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[(i - 1 + pts.length) % pts.length];
      const b = pts[i];
      const c = pts[(i + 1) % pts.length];
      const abx = b.gx - a.gx, aby = b.gy - a.gy;
      const bcx = c.gx - b.gx, bcy = c.gy - b.gy;
      const lenAB = Math.hypot(abx, aby), lenBC = Math.hypot(bcx, bcy);
      if (lenAB < EPS || lenBC < EPS) continue;
      const cross = abx * bcy - aby * bcx;
      const sinAngle = Math.abs(cross) / (lenAB * lenBC);
      if (sinAngle < 0.02) { // 約1度未満のズレは直線/折り返しとみなし、余分な頂点として除去
        pts.splice(i, 1);
        changed = true;
        break;
      }
    }
  }
  return pts;
}

/* ---------------- 面積・重心計算 ---------------- */
function polygonAreaMasu(points) {
  let area = 0;
  for (let i = 0; i < points.length; i++) {
    const p1 = points[i], p2 = points[(i + 1) % points.length];
    area += p1.gx * p2.gy - p2.gx * p1.gy;
  }
  return Math.abs(area) / 2;
}
function masuToTatami(masu) { return Math.round((masu / MASU_PER_TATAMI) * 100) / 100; }

// 多角形の真の重心(頂点の単純平均ではなく面積加重の重心)。退化(面積0)の場合は単純平均にフォールバック
function polygonCentroidScreen(points) {
  const px = points.map((p) => gridToScreen(p.gx, p.gy));
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < px.length; i++) {
    const p0 = px[i], p1 = px[(i + 1) % px.length];
    const cross = p0.x * p1.y - p1.x * p0.y;
    a += cross;
    cx += (p0.x + p1.x) * cross;
    cy += (p0.y + p1.y) * cross;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-6) {
    return { x: px.reduce((s, p) => s + p.x, 0) / px.length, y: px.reduce((s, p) => s + p.y, 0) / px.length };
  }
  return { x: cx / (6 * a), y: cy / (6 * a) };
}
// L字等の凹型の部屋では、部屋全体を囲む外接矩形(bounding box)は実際の部屋の
// 形より大きくなる(欠けた角の分)。ラベルの文字サイズを外接矩形の幅基準で
// 決めてしまうと、その高さで実際には部屋が欠けて狭くなっている場合に文字が
// 部屋の外(欠けた部分)へはみ出してしまう。そこで、ラベルを描く実際の位置を
// 通る水平線・垂直線で多角形を切った時の実寸の幅・高さを使うようにする。
function polygonWidthAtY(pts, rowY, pointX) {
  const xs = [];
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[j], b = pts[i];
    if ((a.y > rowY) !== (b.y > rowY)) {
      const t = (rowY - a.y) / (b.y - a.y);
      xs.push(a.x + (b.x - a.x) * t);
    }
  }
  xs.sort((p, q) => p - q);
  for (let i = 0; i + 1 < xs.length; i += 2) {
    if (pointX >= xs[i] - 0.5 && pointX <= xs[i + 1] + 0.5) return xs[i + 1] - xs[i];
  }
  let maxSpan = 0;
  for (let i = 0; i + 1 < xs.length; i += 2) maxSpan = Math.max(maxSpan, xs[i + 1] - xs[i]);
  return maxSpan;
}
function polygonHeightAtX(pts, colX, pointY) {
  const ys = [];
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[j], b = pts[i];
    if ((a.x > colX) !== (b.x > colX)) {
      const t = (colX - a.x) / (b.x - a.x);
      ys.push(a.y + (b.y - a.y) * t);
    }
  }
  ys.sort((p, q) => p - q);
  for (let i = 0; i + 1 < ys.length; i += 2) {
    if (pointY >= ys[i] - 0.5 && pointY <= ys[i + 1] + 0.5) return ys[i + 1] - ys[i];
  }
  let maxSpan = 0;
  for (let i = 0; i + 1 < ys.length; i += 2) maxSpan = Math.max(maxSpan, ys[i + 1] - ys[i]);
  return maxSpan;
}
function polygonScreenArea(points) {
  const px = points.map((p) => gridToScreen(p.gx, p.gy));
  let area = 0;
  for (let i = 0; i < px.length; i++) {
    const a = px[i], b = px[(i + 1) % px.length];
    area += a.x * b.y - b.x * a.y;
  }
  return Math.abs(area) / 2;
}

// 外開き(swingOut)の開き戸か判定する。引き戸・窓は振れ込まないため対象外。
function isOutwardHingeDoor(d) {
  return (d.type === "hinge" || d.type === "hinge_double") && !!d.swingOut;
}

/* ---------------- 描画 ---------------- */
function render() {
  dctx.clearRect(0, 0, W, H);
  drawOtherFloorsGhost();
  for (const room of state.rooms) drawRoomPolygon(room);
  // 外開きの開き戸は、部屋の外(隣室・屋外側)へ意図的にスイングするため、
  // どの部屋がクリップも無く最後に描く(そうしないと、後から描かれる別の
  // 部屋の塗りつぶしの下に隠れてしまうことがあるため)。
  state.rooms.forEach((room) => {
    (room.doors || []).filter((d) => isOutwardHingeDoor(d)).forEach((d) => drawDoorMark(room, d));
  });
  if (currentTool === "wall" && editingRoom) { drawVertexHandles(editingRoom); drawFixtureHandle(editingRoom); }

  if (drawingPoints.length > 0) {
    dctx.beginPath();
    drawingPoints.forEach((p, i) => {
      const { x, y } = gridToScreen(p.gx, p.gy);
      if (i === 0) dctx.moveTo(x, y); else dctx.lineTo(x, y);
    });
    if (previewPoint) {
      const { x, y } = gridToScreen(previewPoint.gx, previewPoint.gy);
      dctx.lineTo(x, y);
    }
    dctx.strokeStyle = "#2f6fed"; dctx.lineWidth = 3;
    dctx.setLineDash([7, 5]); dctx.stroke(); dctx.setLineDash([]);

    drawingPoints.forEach((p, i) => {
      const { x, y } = gridToScreen(p.gx, p.gy);
      dctx.beginPath();
      dctx.arc(x, y, i === 0 ? 9 : 6, 0, Math.PI * 2);
      dctx.fillStyle = i === 0 ? "#2f6fed" : "#ffffff";
      dctx.fill(); dctx.lineWidth = 2; dctx.strokeStyle = "#2f6fed"; dctx.stroke();
    });
    if (previewPoint) {
      const { x, y } = gridToScreen(previewPoint.gx, previewPoint.gy);
      const closeEnough = drawingPoints.length >= 3 && isNearFirstPoint(previewPoint);
      dctx.beginPath();
      dctx.arc(x, y, 10, 0, Math.PI * 2);
      dctx.fillStyle = closeEnough ? "#1fb15c" : "#2f6fed";
      dctx.fill();
    }
  }
  updateTotals();
  updateFinishButtonState();
}

// 玄関・収納系は不動産図面の慣習に合わせ、斜めハッチング(斜線模様)で
// 「土間・棚板のある空間」であることを表現する(WebCAD等の完成図を参考)。
const HATCH_ROOM_KEYS = ["genkan", "oshiire", "shuno", "wic", "ut"];
function drawHatchFill(room) {
  const pts = room.points.map((p) => gridToScreen(p.gx, p.gy));
  const minX = Math.min(...pts.map((p) => p.x)), maxX = Math.max(...pts.map((p) => p.x));
  const minY = Math.min(...pts.map((p) => p.y)), maxY = Math.max(...pts.map((p) => p.y));
  dctx.save();
  dctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) dctx.moveTo(p.x, p.y); else dctx.lineTo(p.x, p.y); });
  dctx.closePath();
  dctx.clip();
  dctx.strokeStyle = "rgba(90,80,50,0.28)";
  dctx.lineWidth = 1;
  const spacing = 8;
  const span = (maxX - minX) + (maxY - minY);
  for (let d = 0; d < span; d += spacing) {
    dctx.beginPath();
    dctx.moveTo(minX + d, minY);
    dctx.lineTo(minX + d - (maxY - minY), maxY);
    dctx.stroke();
  }
  dctx.restore();
}

function fixtureScaleFactor(room) {
  // トイレ・洗面台・キッチン等の設備アイコン専用の拡大縮小係数(0.55〜1.6)。
  // 建具(ドア)は実寸(widthMasu)に紐づく絶対サイズで描画するため、この
  // 部屋面積連動の縮小・拡大は設備アイコンにのみ適用する。
  const areaPx = polygonScreenArea(room.points);
  const refArea = (BASE_CELL * view.scale) * (BASE_CELL * view.scale) * 4; // 目安: 2x2マス
  return Math.max(0.55, Math.min(1.6, Math.sqrt(areaPx / refArea)));
}

function drawRoomPolygon(room) {
  const type = ROOM_TYPES.find((t) => t.key === room.typeKey) || ROOM_TYPES[ROOM_TYPES.length - 1];
  const isEditing = editingRoom === room;
  dctx.beginPath();
  room.points.forEach((p, i) => {
    const { x, y } = gridToScreen(p.gx, p.gy);
    if (i === 0) dctx.moveTo(x, y); else dctx.lineTo(x, y);
  });
  dctx.closePath();
  dctx.fillStyle = colorScheme === "simple" ? SIMPLE_FILL : type.color;
  dctx.fill();
  dctx.lineWidth = isEditing ? 5 : 3;
  dctx.strokeStyle = isEditing ? "#1c2733" : (colorScheme === "simple" ? SIMPLE_STROKE : type.stroke);
  dctx.stroke();
  if (HATCH_ROOM_KEYS.includes(room.typeKey)) drawHatchFill(room);

  // 内開きの建具・設備アイコンが部屋の外(隣室側)へ描画はみ出さないよう、
  // この部屋自身の多角形でクリップしてから描画する(角付近に開き戸を置いた際に
  // 円弧が隣の部屋へ入り込むバグの対策)。外開きの開き戸は意図的に壁の外側
  // (隣室・屋外側)へスイングするため、このクリップの対象からは除外し、
  // 全部屋を描き終えた後に別途まとめて描く(render()側を参照。そうしないと、
  // 後から描かれる隣室の塗りつぶしの下に隠れてしまうため)。
  const doors = (room.doors || []).filter((d) => !isOutwardHingeDoor(d));

  dctx.save();
  dctx.beginPath();
  room.points.forEach((p, i) => {
    const { x, y } = gridToScreen(p.gx, p.gy);
    if (i === 0) dctx.moveTo(x, y); else dctx.lineTo(x, y);
  });
  dctx.closePath();
  dctx.clip();
  doors.forEach((d) => drawDoorMark(room, d));
  if (room.typeKey === "kaidan") drawStairSymbol(room);

  const c = polygonCentroidScreen(room.points);
  const areaPx = polygonScreenArea(room.points);
  const hasFixture = roomHasFixture(room);
  if (hasFixture) {
    const fp = gridToScreen(fixtureGridPos(room).gx, fixtureGridPos(room).gy);
    dctx.save();
    dctx.translate(fp.x, fp.y);
    dctx.rotate((fixtureRotation(room) * Math.PI) / 180);
    drawRoomFixture(room.typeKey, 0, 0, BASE_CELL * view.scale * fixtureScaleFactor(room));
    dctx.restore();
  }
  dctx.restore();

  // 廊下など、室名も広さも表示する意味がない部屋種別はラベル描画自体を省略する
  if (type.noLabel) return;

  const labelY = hasFixture ? c.y + (BASE_CELL * view.scale * fixtureScaleFactor(room)) * 0.3 : c.y;
  const screenPts = room.points.map((p) => gridToScreen(p.gx, p.gy));
  const boxW = Math.max(...screenPts.map((p) => p.x)) - Math.min(...screenPts.map((p) => p.x));
  const boxH = Math.max(...screenPts.map((p) => p.y)) - Math.min(...screenPts.map((p) => p.y));
  // L字等の凹型の部屋では、ラベルを描く実際の位置での部屋の実寸幅・高さは
  // 外接矩形より狭いことがある(欠けた角の分)。実寸の方が狭ければそちらを使い、
  // ラベルの文字が部屋の外(欠けた部分)へはみ出さないようにする。
  const localW = polygonWidthAtY(screenPts, labelY, c.x);
  const localH = polygonHeightAtX(screenPts, c.x, labelY);
  const maxAllowed = (localW > 0 ? Math.min(localW, boxW) : boxW) - 8;
  const maxAllowedH = (localH > 0 ? Math.min(localH, boxH) : boxH) - 8; // 極端に扁平(縦が狭い)な部屋でラベルが部屋境界にはみ出さないための高さ制約

  function fitLines(text, startSize) {
    let size = startSize;
    const lns = text.split("\n");
    dctx.font = `${size}px -apple-system, sans-serif`;
    let widest = Math.max(...lns.map((l) => dctx.measureText(l).width));
    let blockH = lns.length * (size + 3);
    while ((widest > maxAllowed || blockH > maxAllowedH) && size > 8) {
      size -= 1;
      dctx.font = `${size}px -apple-system, sans-serif`;
      widest = Math.max(...lns.map((l) => dctx.measureText(l).width));
      blockH = lns.length * (size + 3);
    }
    return { lines: lns, size, fits: widest <= maxAllowed && blockH <= maxAllowedH };
  }

  const startSize = areaPx < 2400 ? 11 : 13;
  let result = fitLines(areaPx < 1600 ? `${room.tatami}帖` : `${type.label}\n${room.tatami}帖`, startSize);
  if (!result.fits && result.lines.length > 1) {
    result = fitLines(`${room.tatami}帖`, startSize);
  }
  dctx.font = `${result.size}px -apple-system, sans-serif`;
  dctx.textAlign = "center"; dctx.textBaseline = "middle";
  // 階段の矢印・踏み板や設備アイコンの線が文字と重なっても読めるよう、
  // 白い縁取り(halo)を先に描いてから本体の文字を重ねる。
  dctx.lineWidth = 3;
  dctx.strokeStyle = "rgba(255,255,255,.9)";
  dctx.fillStyle = "#1c2733";
  result.lines.forEach((line, i) => {
    const ly = labelY + (i - (result.lines.length - 1) / 2) * (result.size + 3);
    dctx.strokeText(line, c.x, ly);
    dctx.fillText(line, c.x, ly);
  });
}

// 部屋種別に応じて自動描画する設備の簡易線画(トイレ=タンク矩形+便座楕円、
// 浴室=浴槽矩形+排水口、洗面所=カウンター矩形+ボウル楕円)。不動産図面の
// 慣習(絵文字ではなく線画+略記)に合わせ、塗りなしのストロークのみで描く。
const FIXTURE_ROOM_KEYS = ["wc", "yokushitsu", "senmen", "kitchen"];
function drawRoomFixture(typeKey, cx, cy, unit) {
  dctx.save();
  dctx.strokeStyle = "#5c6b78"; dctx.lineWidth = 1.2;
  if (typeKey === "kitchen") {
    // キッチンカウンター: シンクゾーンとコンロゾーンを仕切り線で分け、
    // シンクには水栓、コンロは3口で描き、実際の設備配置に近づける
    const w = unit * 0.92, h = unit * 0.36;
    dctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    const dividerX = cx - w / 2 + w * 0.42;
    dctx.beginPath();
    dctx.moveTo(dividerX, cy - h / 2);
    dctx.lineTo(dividerX, cy + h / 2);
    dctx.stroke();
    const sinkW = w * 0.3, sinkH = h * 0.62;
    const sinkX = cx - w / 2 + w * 0.06;
    dctx.strokeRect(sinkX, cy - sinkH / 2, sinkW, sinkH);
    dctx.beginPath();
    dctx.moveTo(sinkX + sinkW / 2, cy - sinkH / 2);
    dctx.lineTo(sinkX + sinkW / 2, cy - sinkH / 2 - h * 0.22);
    dctx.stroke();
    dctx.beginPath();
    dctx.arc(sinkX + sinkW / 2, cy - sinkH / 2 - h * 0.22, unit * 0.025, 0, Math.PI * 2);
    dctx.stroke();
    [0.58, 0.75, 0.92].forEach((f) => {
      dctx.beginPath();
      dctx.arc(cx - w / 2 + w * f, cy, unit * 0.055, 0, Math.PI * 2);
      dctx.stroke();
    });
  } else if (typeKey === "wc") {
    // 洋式便器: タンク+洗浄レバー+背もたれ部+しずく型の便座を分けて描く。
    // 1マス=約90cm(半畳)を基準に、実際の洋式トイレの実寸比率
    // (タンク幅約42cm・奥行約16cm、便座部分は幅約38cm・奥行約43cm、
    // 合計奥行約64cm)に近づけて各部のサイズを調整している。
    const tankW = unit * 0.47, tankH = unit * 0.18;
    const tankY = cy - unit * 0.36;
    dctx.strokeRect(cx - tankW / 2, tankY, tankW, tankH);
    dctx.beginPath();
    dctx.moveTo(cx + tankW / 2 - unit * 0.05, tankY + tankH * 0.3);
    dctx.lineTo(cx + tankW / 2 + unit * 0.05, tankY + tankH * 0.3);
    dctx.stroke();
    const backW = unit * 0.42, backH = unit * 0.06;
    dctx.strokeRect(cx - backW / 2, tankY + tankH, backW, backH);
    const bowlCy = tankY + tankH + backH + unit * 0.24;
    dctx.beginPath();
    dctx.ellipse(cx, bowlCy, unit * 0.21, unit * 0.24, 0, 0, Math.PI * 2);
    dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(cx, bowlCy - unit * 0.24);
    dctx.lineTo(cx, bowlCy - unit * 0.08);
    dctx.stroke();
  } else if (typeKey === "yokushitsu") {
    const w = unit * 0.8, h = unit * 0.5;
    dctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    dctx.beginPath();
    dctx.arc(cx + w * 0.32, cy, unit * 0.035, 0, Math.PI * 2);
    dctx.stroke();
  } else if (typeKey === "senmen") {
    // 洗面台: カウンター+ボウル+排水口+水栓+鏡(点線)を描き、
    // 単なる楕円だけでなく実際の洗面化粧台らしい見た目にする
    const w = unit * 0.66, h = unit * 0.26;
    dctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    dctx.beginPath();
    dctx.ellipse(cx, cy, unit * 0.21, unit * 0.095, 0, 0, Math.PI * 2);
    dctx.stroke();
    dctx.beginPath();
    dctx.arc(cx, cy, unit * 0.03, 0, Math.PI * 2);
    dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(cx, cy - h / 2);
    dctx.lineTo(cx, cy - h / 2 - unit * 0.08);
    dctx.stroke();
    dctx.beginPath();
    dctx.arc(cx, cy - h / 2 - unit * 0.08, unit * 0.025, 0, Math.PI * 2);
    dctx.stroke();
    dctx.setLineDash([unit * 0.03, unit * 0.03]);
    dctx.strokeRect(cx - w * 0.4, cy - h / 2 - unit * 0.22, w * 0.8, unit * 0.12);
    dctx.setLineDash([]);
  }
  dctx.restore();
}

// 階段記号: 4頂点(単純な矩形)なら外接矩形の長い方向を上り方向とみなし、短い
// 方向に踏み板の平行線を並べ、中央に上り方向の矢印を描く。5頂点以上(L字・折れ
// 階段)の場合は、へこんでいる頂点(反射頂点)を折り返し地点とみなし、踏み板は
// 矩形全体に格子状に敷いた上で部屋の形にクリップし、矢印は「片方の端→折り返し
// 地点→もう片方の端」の2区間で曲げて描く。
function drawStairSymbol(room) {
  const pts = room.points.map((p) => gridToScreen(p.gx, p.gy));
  const minX = Math.min(...pts.map((p) => p.x)), maxX = Math.max(...pts.map((p) => p.x));
  const minY = Math.min(...pts.map((p) => p.y)), maxY = Math.max(...pts.map((p) => p.y));
  const w = maxX - minX, h = maxY - minY;

  const stepCount = room.stepCount || DEFAULT_STEP_COUNT;

  if (pts.length > 4) {
    // 反射頂点(外接矩形の内側に食い込んでいる頂点)がちょうど1つだけの
    // シンプルなL字はdrawBentStairSymbolで綺麗に描けるが、コの字・Z字等
    // 反射頂点が2つ以上ある(あるいは無い)複雑な形は、その専用ロジックの
    // 前提(帯を2本だけで表現する)が崩れ、一部区画が空白のまま描画されない
    // 不具合があった。その場合は汎用フォールバック(外接矩形全体に踏み板を
    // 敷いた上で実際のポリゴン形状にクリップ)で、少なくとも部屋全体に
    // 踏み板が表示される見た目にする。
    const eps = 0.5;
    const reflexCount = pts.filter((p) =>
      p.x > minX + eps && p.x < maxX - eps && p.y > minY + eps && p.y < maxY - eps
    ).length;
    if (reflexCount === 1) {
      drawBentStairSymbol(pts, minX, maxX, minY, maxY, stepCount);
    } else {
      drawGenericStairSymbol(pts, minX, maxX, minY, maxY, stepCount);
    }
    return;
  }

  const vertical = h >= w;
  const treadCount = stepCount;
  dctx.save();
  dctx.strokeStyle = "#5c6b78"; dctx.lineWidth = 1;
  if (vertical) {
    for (let i = 1; i < treadCount; i++) {
      const y = minY + (h * i) / treadCount;
      dctx.beginPath(); dctx.moveTo(minX + w * 0.15, y); dctx.lineTo(maxX - w * 0.15, y); dctx.stroke();
    }
    const ax = minX + w / 2;
    dctx.beginPath(); dctx.moveTo(ax, maxY - h * 0.1); dctx.lineTo(ax, minY + h * 0.1); dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(ax, minY + h * 0.1); dctx.lineTo(ax - w * 0.06, minY + h * 0.18);
    dctx.moveTo(ax, minY + h * 0.1); dctx.lineTo(ax + w * 0.06, minY + h * 0.18);
    dctx.stroke();
  } else {
    for (let i = 1; i < treadCount; i++) {
      const x = minX + (w * i) / treadCount;
      dctx.beginPath(); dctx.moveTo(x, minY + h * 0.15); dctx.lineTo(x, maxY - h * 0.15); dctx.stroke();
    }
    const ay = minY + h / 2;
    dctx.beginPath(); dctx.moveTo(maxX - w * 0.1, ay); dctx.lineTo(minX + w * 0.1, ay); dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(minX + w * 0.1, ay); dctx.lineTo(minX + w * 0.18, ay - h * 0.06);
    dctx.moveTo(minX + w * 0.1, ay); dctx.lineTo(minX + w * 0.18, ay + h * 0.06);
    dctx.stroke();
  }
  dctx.restore();
}

// コの字・Z字等、反射頂点が2つ以上(または0)ある複雑な形の階段用フォールバック。
// 実際の部屋の輪郭にクリップした上で、外接矩形全体に踏み板の平行線を敷くため、
// 部屋の一部が空白のまま描かれない(=drawBentStairSymbolの帯モデルが前提と
// する「反射頂点1つのL字」から外れた形で発生していた不具合)。矢印は長辺方向の
// 直線1本の簡易近似(実際の折れ方までは表現しないが、視覚的な破綻は避けられる)。
function drawGenericStairSymbol(pts, minX, maxX, minY, maxY, stepCount) {
  const w = maxX - minX, h = maxY - minY;
  const vertical = h >= w;
  const treadCount = stepCount;
  dctx.save();
  dctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) dctx.moveTo(p.x, p.y); else dctx.lineTo(p.x, p.y); });
  dctx.closePath();
  dctx.clip();
  dctx.strokeStyle = "#5c6b78"; dctx.lineWidth = 1;
  if (vertical) {
    for (let i = 1; i < treadCount; i++) {
      const y = minY + (h * i) / treadCount;
      dctx.beginPath(); dctx.moveTo(minX, y); dctx.lineTo(maxX, y); dctx.stroke();
    }
  } else {
    for (let i = 1; i < treadCount; i++) {
      const x = minX + (w * i) / treadCount;
      dctx.beginPath(); dctx.moveTo(x, minY); dctx.lineTo(x, maxY); dctx.stroke();
    }
  }
  dctx.restore();

  dctx.save();
  dctx.strokeStyle = "#2f6fed"; dctx.lineWidth = 2.4;
  if (vertical) {
    const ax = minX + w / 2;
    dctx.beginPath(); dctx.moveTo(ax, maxY - h * 0.1); dctx.lineTo(ax, minY + h * 0.1); dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(ax, minY + h * 0.1); dctx.lineTo(ax - w * 0.06, minY + h * 0.18);
    dctx.moveTo(ax, minY + h * 0.1); dctx.lineTo(ax + w * 0.06, minY + h * 0.18);
    dctx.stroke();
  } else {
    const ay = minY + h / 2;
    dctx.beginPath(); dctx.moveTo(maxX - w * 0.1, ay); dctx.lineTo(minX + w * 0.1, ay); dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(minX + w * 0.1, ay); dctx.lineTo(minX + w * 0.18, ay - h * 0.06);
    dctx.moveTo(minX + w * 0.1, ay); dctx.lineTo(minX + w * 0.18, ay + h * 0.06);
    dctx.stroke();
  }
  dctx.restore();
}

// L字・コの字等の折れ階段用: 反射頂点(部屋の外接矩形の内側に食い込んでいる頂点)を
// 探し、そこを折り返し地点として矢印を2区間に分けて曲げて描く。踏み板は外接矩形
// 全体に格子状の線を敷いた上で部屋のポリゴン形状にクリップし、L字なりの形だけ
// 表示されるようにする(簡易的な近似だが、どちら向きに折れているかは伝わる)。
function drawBentStairSymbol(pts, minX, maxX, minY, maxY, stepCount) {
  const eps = 0.5;
  const reflex = pts.find((p) =>
    p.x > minX + eps && p.x < maxX - eps && p.y > minY + eps && p.y < maxY - eps
  );

  if (!reflex) {
    // 反射頂点が見つからない不整形な場合は、外接矩形全体に格子状の線を敷いて
    // 部屋の形にクリップするだけに留める(矢印は諦める)
    const w = maxX - minX, h = maxY - minY;
    dctx.save();
    dctx.beginPath();
    pts.forEach((p, i) => { if (i === 0) dctx.moveTo(p.x, p.y); else dctx.lineTo(p.x, p.y); });
    dctx.closePath();
    dctx.clip();
    dctx.strokeStyle = "#5c6b78"; dctx.lineWidth = 1;
    for (let i = 1; i < 10; i++) {
      const x = minX + (w * i) / 10;
      dctx.beginPath(); dctx.moveTo(x, minY); dctx.lineTo(x, maxY); dctx.stroke();
    }
    dctx.restore();
    return;
  }

  // 外接矩形の4隅のうち、部屋のポリゴンに含まれていない(=食い込んでへこんでいる)
  // 隅を探す。これが「欠けている角」で、L字のどちら向きに折れているかを正しく
  // 判定する基準になる(以前はbboxの中点との大小比較で判定しており、正方形に近い
  // 対称な形だと中点とちょうど一致して判定が壊れるバグがあった)。
  function insidePoly(x, y) {
    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)) c = !c;
    }
    return c;
  }
  const inset = Math.max(2, (maxX - minX) * 0.05);
  const cornerCandidates = [
    { x: minX, y: minY }, { x: maxX, y: minY }, { x: minX, y: maxY }, { x: maxX, y: maxY },
  ];
  const missing = cornerCandidates.find((c) => {
    const ix = c.x === minX ? c.x + inset : c.x - inset;
    const iy = c.y === minY ? c.y + inset : c.y - inset;
    return !insidePoly(ix, iy);
  }) || cornerCandidates[0];

  // Band1(横長の帯・full幅、横線の踏み板): 欠けている角のY側と反対のYから、反射頂点のYまで
  // Band2(縦長の帯・full高さ、縦線の踏み板): 欠けている角のX側と反対のXから、反射頂点のXまで
  const band1Y = missing.y === maxY ? [minY, reflex.y] : [reflex.y, maxY];
  const band2X = missing.x === maxX ? [minX, reflex.x] : [reflex.x, maxX];

  const far1Y = Math.abs(band1Y[0] - reflex.y) < 0.01 ? band1Y[1] : band1Y[0];
  const far2X = Math.abs(band2X[0] - reflex.x) < 0.01 ? band2X[1] : band2X[0];
  const dir1 = { x: 0, y: Math.sign(far1Y - reflex.y) || 1 };
  const dir2 = { x: Math.sign(far2X - reflex.x) || 1, y: 0 };

  // 踏み板の向きは「その区間が実際にどちらへ長いか(=歩く向き)」で決める。band1は
  // 常にfull幅・band2は常にfull高さという定義だけを鵜呑みにして向きを固定して
  // いたため、区間の実際の縦横比によっては歩く向きと踏み板が90度ずれる不具合が
  // あった(横長の区間なのに縦方向の踏み板になる等)。band1Y/band2Xは元々「断面
  // (通路の幅)」の範囲なので、向き判定・段数配分・断面の長さには常にこの
  // unshrinkな値を使う。
  const band1W = maxX - minX, band1H = Math.abs(band1Y[1] - band1Y[0]);
  const band1IsWide = band1W >= band1H;
  const travelLen1 = band1IsWide ? band1W : band1H;
  const band2H = maxY - minY, band2W = Math.abs(band2X[1] - band2X[0]);
  const band2IsTall = band2H >= band2W;
  const travelLen2 = band2IsTall ? band2H : band2W;

  // 曲がり角(反射頂点)の手前は踏み板を敷かず、代わりに扇形に回り込む「回り階段
  // (winder)」風の踏み板を描く。「手前を空ける」のは必ず歩く向き(長さ方向)で
  // あって、通路の幅(断面)方向ではない。以前はこれを断面方向に適用してしまい、
  // 通路幅(1マス)のほとんどを空白が占めて踏み板が点のように潰れる不具合があった。
  const landing = Math.min(travelLen1, travelLen2) * 0.3;
  // fullRangeの両端のうち、反射頂点(pivot)により近い側だけをlandingの分だけ内側に
  // 詰める(遠い側はそのまま)。band1のように反射頂点が範囲の「途中」にある場合
  // (端点と一致しない場合)でも正しく動くよう、距離で近い方を判定する
  // (以前は「r0が反射頂点と一致する前提」で書かれており、一致しないと計算が
  // 破綻して踏み板の範囲がほぼ0に潰れる不具合があった)。
  function shrinkLengthNearReflex(fullRange, pivot) {
    const [r0, r1] = fullRange;
    if (Math.abs(r0 - pivot) <= Math.abs(r1 - pivot)) {
      return [Math.min(r0 + landing, r1), r1];
    }
    return [r0, Math.max(r1 - landing, r0)];
  }
  // band1の踏み板を並べる「長さ方向」の範囲(歩く向きがXならX、Yなら元々のband1Y)
  const band1Length = band1IsWide
    ? shrinkLengthNearReflex([minX, maxX], reflex.x)
    : shrinkLengthNearReflex(band1Y, reflex.y);
  // band2の踏み板を並べる「長さ方向」の範囲
  const band2Length = band2IsTall
    ? shrinkLengthNearReflex([minY, maxY], reflex.y)
    : shrinkLengthNearReflex(band2X, reflex.x);

  // 段数(stepCount)を、各区間の実際の歩く向きの長さの比で振り分ける。
  // 曲がり角の扇形踏み板におよそ1段分を割り当ててから、残りを長さ比で配分する。
  const fanSteps = Math.min(3, Math.max(1, Math.round(stepCount * 0.15)));
  const straightSteps = Math.max(2, stepCount - fanSteps);
  const totalLen = travelLen1 + travelLen2 || 1;
  const legTreads1 = Math.max(1, Math.round(straightSteps * (travelLen1 / totalLen)));
  const legTreads2 = Math.max(1, straightSteps - legTreads1);
  dctx.save();
  dctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) dctx.moveTo(p.x, p.y); else dctx.lineTo(p.x, p.y); });
  dctx.closePath();
  dctx.clip();
  dctx.strokeStyle = "#5c6b78"; dctx.lineWidth = 1;
  // band1: 踏み板は断面(band1Yの全幅)いっぱいに引き、長さ方向の位置はband1Lengthで並べる
  if (band1IsWide) {
    for (let i = 1; i < legTreads1; i++) {
      const x = band1Length[0] + ((band1Length[1] - band1Length[0]) * i) / legTreads1;
      dctx.beginPath(); dctx.moveTo(x, band1Y[0]); dctx.lineTo(x, band1Y[1]); dctx.stroke();
    }
  } else {
    for (let i = 1; i < legTreads1; i++) {
      const y = band1Length[0] + ((band1Length[1] - band1Length[0]) * i) / legTreads1;
      dctx.beginPath(); dctx.moveTo(minX, y); dctx.lineTo(maxX, y); dctx.stroke();
    }
  }
  // band2: 踏み板は断面(band2Xの全幅)いっぱいに引き、長さ方向の位置はband2Lengthで並べる
  if (band2IsTall) {
    for (let i = 1; i < legTreads2; i++) {
      const y = band2Length[0] + ((band2Length[1] - band2Length[0]) * i) / legTreads2;
      dctx.beginPath(); dctx.moveTo(band2X[0], y); dctx.lineTo(band2X[1], y); dctx.stroke();
    }
  } else {
    for (let i = 1; i < legTreads2; i++) {
      const x = band2Length[0] + ((band2Length[1] - band2Length[0]) * i) / legTreads2;
      dctx.beginPath(); dctx.moveTo(x, minY); dctx.lineTo(x, maxY); dctx.stroke();
    }
  }
  // 回り階段の扇形踏み板: 反射頂点(内側の角)を要に、片方の脚の向きから他方の脚の
  // 向きまで角度を振って放射線を引く。各線の先端は、直線内挿ではなく実際に
  // その角度の光線が外周の壁(反射頂点の対角にあるコーナーで直角に交わる2枚の壁)の
  // どちらと交わるかを計算して置くことで、すべての線の端が確実に枠(壁)に接するようにする。
  const fanOuterCorner = {
    x: missing.x === maxX ? minX : maxX,
    y: missing.y === maxY ? minY : maxY,
  };
  const fanN = fanSteps + 1;
  for (let i = 0; i <= fanN; i++) {
    const t = (i / fanN) * (Math.PI / 2);
    const dx = dir1.x * Math.cos(t) + dir2.x * Math.sin(t);
    const dy = dir1.y * Math.cos(t) + dir2.y * Math.sin(t);
    const tX = dx !== 0 ? (fanOuterCorner.x - reflex.x) / dx : Infinity;
    const tY = dy !== 0 ? (fanOuterCorner.y - reflex.y) / dy : Infinity;
    const tHit = Math.min(tX > 0 ? tX : Infinity, tY > 0 ? tY : Infinity);
    const ex = reflex.x + dx * tHit;
    const ey = reflex.y + dy * tHit;
    dctx.beginPath();
    dctx.moveTo(reflex.x, reflex.y);
    dctx.lineTo(ex, ey);
    dctx.stroke();
  }
  dctx.restore();

  // 矢印の経路: 各区間の断面の中心線(壁際ではなく通路の真ん中)を通り、各区間の
  // 「実際の歩く向き」(band1IsWide/band2IsTallで判定済み)に沿って遠い端まで
  // 伸ばす。曲がり角は両方の中心線が交わる点にする(以前は反射頂点=壁際の頂点を
  // そのまま使っていたため、矢印が通路の端に寄ってしまっていた)。
  const band1CenterY = (band1Y[0] + band1Y[1]) / 2;
  const band2CenterX = (band2X[0] + band2X[1]) / 2;
  const farXFromReflex = Math.abs(reflex.x - minX) > Math.abs(maxX - reflex.x) ? minX : maxX;
  const farYFromReflex = Math.abs(reflex.y - minY) > Math.abs(maxY - reflex.y) ? minY : maxY;
  const start = band1IsWide ? { x: farXFromReflex, y: band1CenterY } : { x: band2CenterX, y: far1Y };
  const bend = { x: band2CenterX, y: band1CenterY };
  const end = band2IsTall ? { x: band2CenterX, y: farYFromReflex } : { x: far2X, y: band1CenterY };

  dctx.save();
  dctx.strokeStyle = "#2f6fed"; dctx.lineWidth = 2.4;
  dctx.beginPath();
  dctx.moveTo(start.x, start.y);
  dctx.lineTo(bend.x, bend.y);
  dctx.lineTo(end.x, end.y);
  dctx.stroke();
  // 矢印の先端(end側=上りの終点)
  const dx = end.x - bend.x, dy = end.y - bend.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const headLen = Math.min(12, len * 0.4);
  dctx.beginPath();
  dctx.moveTo(end.x, end.y);
  dctx.lineTo(end.x - ux * headLen - uy * headLen * 0.5, end.y - uy * headLen + ux * headLen * 0.5);
  dctx.moveTo(end.x, end.y);
  dctx.lineTo(end.x - ux * headLen + uy * headLen * 0.5, end.y - uy * headLen - ux * headLen * 0.5);
  dctx.stroke();
  dctx.restore();
}

// 「編集/消す」ツールで選択中の部屋の頂点にハンドル(丸印)を表示する。
// ハンドルをドラッグすると頂点の位置を後から調整できる(vertexDrag参照)。
function drawVertexHandles(room) {
  room.points.forEach((p) => {
    const { x, y } = gridToScreen(p.gx, p.gy);
    dctx.beginPath();
    dctx.arc(x, y, 9, 0, Math.PI * 2);
    dctx.fillStyle = "#ffffff";
    dctx.fill();
    dctx.lineWidth = 2.5;
    dctx.strokeStyle = "#2f6fed";
    dctx.stroke();
  });
}
function hitTestVertexHandle(room, sx, sy) {
  for (let i = 0; i < room.points.length; i++) {
    const p = gridToScreen(room.points[i].gx, room.points[i].gy);
    if (Math.hypot(sx - p.x, sy - p.y) <= 20) return i;
  }
  return null;
}

// グリッド座標(gx,gy)系での多角形の面積重心。L字等の凹型の部屋では単純な
// 頂点の平均(旧実装)だと欠けた角(ノッチ)の中に来てしまうことがあるため、
// 面積に基づく重心を使う。
function polygonCentroidGrid(points) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < points.length; i++) {
    const p0 = points[i], p1 = points[(i + 1) % points.length];
    const cross = p0.gx * p1.gy - p1.gx * p0.gy;
    a += cross;
    cx += (p0.gx + p1.gx) * cross;
    cy += (p0.gy + p1.gy) * cross;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-9) {
    return { gx: points.reduce((s, p) => s + p.gx, 0) / points.length, gy: points.reduce((s, p) => s + p.gy, 0) / points.length };
  }
  return { gx: cx / (6 * a), gy: cy / (6 * a) };
}
// グリッド座標系での点が多角形の内側にあるかの判定(レイキャスティング法)。
function isPointInPolygonGrid(gx, gy, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].gx, yi = points[i].gy, xj = points[j].gx, yj = points[j].gy;
    if (((yi > gy) !== (yj > gy)) && (gx < ((xj - xi) * (gy - yi)) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// トイレ/浴室/洗面所/キッチンの設備アイコンは、部屋の中の好きな位置へ
// ドラッグで動かせる(実際の間取りでは配管の都合等で中央に来るとは限らないため)。
// room.fixturePosが未設定なら部屋の重心よりやや上を初期位置とする。
// L字等の凹型の部屋では、重心(や単純平均)が欠けた角(部屋の外)に来ることが
// あるため、実際に部屋の内側にあるか確認し、外なら順にフォールバックする。
function defaultFixtureGridPos(room) {
  const centroid = polygonCentroidGrid(room.points);
  const nudged = { gx: centroid.gx, gy: centroid.gy - 0.3 };
  if (isPointInPolygonGrid(nudged.gx, nudged.gy, room.points)) return nudged;
  if (isPointInPolygonGrid(centroid.gx, centroid.gy, room.points)) return centroid;
  let gx = 0, gy = 0;
  room.points.forEach((p) => { gx += p.gx; gy += p.gy; });
  const n = room.points.length;
  const avg = { gx: gx / n, gy: gy / n };
  if (isPointInPolygonGrid(avg.gx, avg.gy, room.points)) return avg;
  return { gx: room.points[0].gx, gy: room.points[0].gy };
}
function fixtureGridPos(room) { return room.fixturePos || defaultFixtureGridPos(room); }
function roomHasFixture(room) {
  return FIXTURE_ROOM_KEYS.includes(room.typeKey) && polygonScreenArea(room.points) >= 900;
}
// 設備アイコンの向き(度数、0=初期の正立方向)。位置と同様にドラッグで変えられる。
function fixtureRotation(room) { return room.fixtureRotation || 0; }
const FIXTURE_ROTATE_HANDLE_R_PX = 34; // 位置ハンドルの中心から、回転ハンドルまでの距離
function fixtureRotateHandlePos(room) {
  const { x, y } = gridToScreen(fixtureGridPos(room).gx, fixtureGridPos(room).gy);
  const rad = ((fixtureRotation(room) - 90) * Math.PI) / 180;
  return { x: x + Math.cos(rad) * FIXTURE_ROTATE_HANDLE_R_PX, y: y + Math.sin(rad) * FIXTURE_ROTATE_HANDLE_R_PX };
}
function drawFixtureHandle(room) {
  if (!roomHasFixture(room)) return;
  const { x, y } = gridToScreen(fixtureGridPos(room).gx, fixtureGridPos(room).gy);
  dctx.beginPath();
  dctx.arc(x, y, 14, 0, Math.PI * 2);
  dctx.fillStyle = "rgba(111,79,237,.16)";
  dctx.fill();
  dctx.lineWidth = 2.5;
  dctx.strokeStyle = "#6f4fed";
  dctx.setLineDash([3, 3]);
  dctx.stroke();
  dctx.setLineDash([]);

  // 回転ハンドル: 位置ハンドルから線でつないだ先の小さい丸。ドラッグすると
  // その方向へ設備アイコンの向きが変わる。見つけやすいよう、位置ハンドルより
  // ひと回り大きめにし、中に回転を示す矢印記号を描く。
  const rp = fixtureRotateHandlePos(room);
  dctx.beginPath();
  dctx.moveTo(x, y);
  dctx.lineTo(rp.x, rp.y);
  dctx.strokeStyle = "#6f4fed";
  dctx.lineWidth = 1.5;
  dctx.stroke();
  dctx.beginPath();
  dctx.arc(rp.x, rp.y, 11, 0, Math.PI * 2);
  dctx.fillStyle = "#fff";
  dctx.fill();
  dctx.lineWidth = 2;
  dctx.strokeStyle = "#6f4fed";
  dctx.stroke();
  dctx.fillStyle = "#6f4fed";
  dctx.font = "12px -apple-system, sans-serif";
  dctx.textAlign = "center"; dctx.textBaseline = "middle";
  dctx.fillText("⟳", rp.x, rp.y + 0.5);
}
function hitTestFixtureHandle(room, sx, sy) {
  if (!roomHasFixture(room)) return false;
  const p = gridToScreen(fixtureGridPos(room).gx, fixtureGridPos(room).gy);
  return Math.hypot(sx - p.x, sy - p.y) <= FIXTURE_HIT_RADIUS_PX;
}
function hitTestFixtureRotateHandle(room, sx, sy) {
  if (!roomHasFixture(room)) return false;
  const p = fixtureRotateHandlePos(room);
  return Math.hypot(sx - p.x, sy - p.y) <= FIXTURE_HIT_RADIUS_PX;
}

// 全階俯瞰: 「全階表示」がONの場合、現在の階以外の部屋を薄いゴースト表示で
// 重ねる(データはlocalStorageから都度読み込む。物件全体の配置バランスを
// 確認する用途で、編集はできない)。
let showAllFloors = false;
function drawOtherFloorsGhost() {
  if (!showAllFloors) return;
  const all = loadAllProjects();
  const proj = all[state.projectName];
  if (!proj || !proj.floors) return;
  Object.keys(proj.floors).forEach((f) => {
    if (f === state.floorName) return;
    const fd = normalizeFloorData(proj.floors[f]);
    dctx.save();
    dctx.globalAlpha = 0.28;
    fd.rooms.forEach((room) => {
      dctx.beginPath();
      room.points.forEach((p, i) => {
        const { x, y } = gridToScreen(p.gx, p.gy);
        if (i === 0) dctx.moveTo(x, y); else dctx.lineTo(x, y);
      });
      dctx.closePath();
      dctx.strokeStyle = "#7c8996"; dctx.lineWidth = 2;
      dctx.setLineDash([4, 3]);
      dctx.stroke();
      dctx.setLineDash([]);
    });
    dctx.restore();
  });
}

function doorScreenPos(room, door) {
  const p1 = room.points[door.edge];
  const p2 = room.points[(door.edge + 1) % room.points.length];
  const s1 = gridToScreen(p1.gx, p1.gy), s2 = gridToScreen(p2.gx, p2.gy);
  return { x: s1.x + (s2.x - s1.x) * door.ratio, y: s1.y + (s2.y - s1.y) * door.ratio };
}

// 建具の製図記号を描画する。壁(辺)の方向ベクトルを軸に、開き戸は円弧+扉本体、
// 引き戸は平行2本線、窓はサッシ線(引き違いは中央仕切り線も)で表現する。
// 幅(doorWidth)は壁の長さに対する比率ではなく、door.widthMasu(実寸換算の
// 絶対値・グリッド単位)をそのままpx変換した値を使う(壁が短い場合のみ、
// 壁からはみ出さないようedgeLenの90%を上限にクランプする)。
function drawDoorMark(room, door) {
  const p1 = room.points[door.edge];
  const p2 = room.points[(door.edge + 1) % room.points.length];
  const s1 = gridToScreen(p1.gx, p1.gy), s2 = gridToScreen(p2.gx, p2.gy);
  const edgeLen = Math.hypot(s2.x - s1.x, s2.y - s1.y);
  if (edgeLen < 1) return;
  const ux = (s2.x - s1.x) / edgeLen, uy = (s2.y - s1.y) / edgeLen; // 壁沿いの単位ベクトル
  let nx = -uy, ny = ux; // 法線ベクトル(既定では壁から室内側へ90度)
  const type = door.type;
  // 開き戸(hinge/hinge_double)は、内開き(既定)なら室内側へ、外開きなら
  // 法線を反転させて壁の外側(隣室・屋外など)へスイングするようにする。
  // 引き戸・窓は壁に沿うだけで振れ込まないため、この向きに影響されない。
  if ((type === "hinge" || type === "hinge_double") && door.swingOut) {
    nx = -nx; ny = -ny;
  }

  const center = { x: s1.x + ux * edgeLen * door.ratio, y: s1.y + uy * edgeLen * door.ratio };
  const widthMasu = Math.min(door.widthMasu || 0.85, (edgeLen / (BASE_CELL * view.scale)) * 0.9);
  const doorWidth = Math.max(16, widthMasu * BASE_CELL * view.scale);
  const a = { x: center.x - ux * doorWidth / 2, y: center.y - uy * doorWidth / 2 };
  const b = { x: center.x + ux * doorWidth / 2, y: center.y + uy * doorWidth / 2 };
  const flip = !!door.flip;

  dctx.save();
  dctx.strokeStyle = "#1c2733";
  dctx.lineWidth = 1.4;

  if (type === "hinge_double") {
    const half = doorWidth / 2;
    drawHingeLeaf(a, ux, uy, nx, ny, half, flip);
    drawHingeLeaf(b, -ux, -uy, nx, ny, half, flip);
  } else if (type === "hinge") {
    // flip=false: 吊元はa側(壁沿い正方向へ弧を描く)。flip=true: 吊元をb側にする
    if (!flip) drawHingeLeaf(a, ux, uy, nx, ny, doorWidth, false);
    else drawHingeLeaf(b, -ux, -uy, nx, ny, doorWidth, false);
  } else if (type === "slide" || type === "slide_double") {
    // 引き戸: 壁厚の中に平行2本線。片引きは戸袋側(a方向)へ延長して引き込みを表現
    const off = 2.5;
    dctx.beginPath();
    dctx.moveTo(a.x + nx * off, a.y + ny * off);
    dctx.lineTo(b.x + nx * off, b.y + ny * off);
    dctx.moveTo(a.x - nx * off, a.y - ny * off);
    dctx.lineTo(b.x - nx * off, b.y - ny * off);
    dctx.stroke();
    if (type === "slide") {
      const ext = flip ? { x: b.x + ux * doorWidth * 0.9, y: b.y + uy * doorWidth * 0.9 } : { x: a.x - ux * doorWidth * 0.9, y: a.y - uy * doorWidth * 0.9 };
      const base = flip ? b : a;
      dctx.setLineDash([3, 3]);
      dctx.beginPath();
      dctx.moveTo(base.x + nx * off, base.y + ny * off);
      dctx.lineTo(ext.x + nx * off, ext.y + ny * off);
      dctx.stroke();
      dctx.setLineDash([]);
    }
  } else {
    // window_slide / window_fix: 太い外壁線に埋もれて見えなくならないよう、まず
    // 壁を横切る白い帯で「開口部」をはっきり切り抜いてから、太めのサッシ線を描く
    // (マイソク品質評価で「窓が見当たらない」と複数回指摘されたための強調修正)。
    const cutOff = 7;
    dctx.save();
    dctx.strokeStyle = "#ffffff";
    dctx.lineWidth = cutOff * 2;
    dctx.beginPath();
    dctx.moveTo(a.x, a.y);
    dctx.lineTo(b.x, b.y);
    dctx.stroke();
    dctx.restore();

    const off = 3.5;
    dctx.lineWidth = 2.2;
    dctx.beginPath();
    dctx.moveTo(a.x + nx * off, a.y + ny * off);
    dctx.lineTo(b.x + nx * off, b.y + ny * off);
    dctx.moveTo(a.x - nx * off, a.y - ny * off);
    dctx.lineTo(b.x - nx * off, b.y - ny * off);
    dctx.stroke();
    if (type === "window_slide") {
      dctx.beginPath();
      dctx.moveTo(center.x + nx * off, center.y + ny * off);
      dctx.lineTo(center.x - nx * off, center.y - ny * off);
      dctx.stroke();
    }
  }
  dctx.restore();
}

function drawHingeLeaf(hinge, dirx, diry, nx, ny, len, flip) {
  const sign = flip ? -1 : 1;
  const tipX = hinge.x + nx * len * sign, tipY = hinge.y + ny * len * sign;
  // 扉本体(吊元から開いた状態の先端まで)
  dctx.beginPath();
  dctx.moveTo(hinge.x, hinge.y);
  dctx.lineTo(tipX, tipY);
  dctx.stroke();
  // 開閉軌跡(円弧): 壁沿い(閉じた状態)から法線方向(開いた状態)まで
  const startAngle = Math.atan2(diry, dirx);
  const endAngle = Math.atan2(ny * sign, nx * sign);
  dctx.beginPath();
  dctx.arc(hinge.x, hinge.y, len, startAngle, endAngle, flip);
  dctx.stroke();
}

function updateTotals() {
  const total = state.rooms.reduce((s, r) => s + r.tatami, 0);
  $("totalTatami").textContent = Math.round(total * 2) / 2;
  $("roomCount").textContent = state.rooms.length;
  $("projectTitle").textContent = `${state.projectName} - ${state.floorName}`;
}
function updateFinishButtonState() {
  $("btnFinishRoom").disabled = drawingPoints.length < 3;
}

let hintTimer = null;
function showHint(text, persistMs) {
  const el = $("hint");
  el.textContent = text; el.style.opacity = 1;
  clearTimeout(hintTimer);
  // persistMs指定時もいずれ自動で消す(既定5.5秒)。0/未指定なら短め(2.6秒)
  const ms = persistMs === true ? 5500 : (persistMs || 2600);
  hintTimer = setTimeout(() => { el.style.opacity = 0; }, ms);
}
function hideHintNow() {
  clearTimeout(hintTimer);
  $("hint").style.opacity = 0;
}
// ヒントは常にpointer-events:noneとし、下の部屋やボタンへのタップを
// 邪魔しない(以前タップで消せるようにpointer-events:autoにしていた際、
// 表示中は画面左上のタップを吸収して部屋選択できなくなる不具合があった)。
// 代わりに、次の操作(どこをタップしても)が始まった時点でヒントを消す。
document.addEventListener("pointerdown", hideHintNow, true);

/* ---------------- ヒットテスト ---------------- */
// world座標(小数のまま)で判定。スナップ済み整数座標だと境界上の点(細い部屋)を
// 取りこぼすため、丸めずに判定する
function hitTestRoom(wx, wy) {
  for (let i = state.rooms.length - 1; i >= 0; i--) {
    const pts = state.rooms[i].points;
    let inside = false;
    for (let a = 0, b = pts.length - 1; a < pts.length; b = a++) {
      const xi = pts[a].gx, yi = pts[a].gy, xj = pts[b].gx, yj = pts[b].gy;
      const intersect = ((yi > wy) !== (yj > wy)) && (wx < (xj - xi) * (wy - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    if (inside) return state.rooms[i];
  }
  return null;
}

function hitTestExistingDoor(screenX, screenY) {
  for (let i = state.rooms.length - 1; i >= 0; i--) {
    const room = state.rooms[i];
    const doors = room.doors || [];
    for (let d = 0; d < doors.length; d++) {
      const p = doorScreenPos(room, doors[d]);
      if (Math.hypot(screenX - p.x, screenY - p.y) <= DOOR_HIT_RADIUS_PX + 6) {
        return { room, index: d };
      }
    }
  }
  return null;
}

function hitTestEdge(room, screenX, screenY) {
  let best = null, bestDist = 22;
  room.points.forEach((p1, i) => {
    const p2 = room.points[(i + 1) % room.points.length];
    const s1 = gridToScreen(p1.gx, p1.gy), s2 = gridToScreen(p2.gx, p2.gy);
    const dx = s2.x - s1.x, dy = s2.y - s1.y;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    let t = ((screenX - s1.x) * dx + (screenY - s1.y) * dy) / (len * len);
    // 角に建具アイコンが被らないよう、端からアイコン半径+マージン分だけは避ける
    const marginRatio = Math.min(0.35, (18) / len);
    t = Math.max(marginRatio, Math.min(1 - marginRatio, t));
    const px = s1.x + dx * t, py = s1.y + dy * t;
    const dist = Math.hypot(screenX - px, screenY - py);
    if (dist < bestDist) { bestDist = dist; best = { edge: i, ratio: t }; }
  });
  return best;
}

// hitTestEdgeと違い距離の上限を設けない版。既存建具をドラッグ移動中は、
// 指がどれだけ壁から離れても「その部屋で一番近い壁」へ必ず追従させたい
// (掴んだ建具が急に無反応になるより、常に追従する方が自然なため)。
function hitTestEdgeForDrag(room, screenX, screenY) {
  let best = null, bestDist = Infinity;
  room.points.forEach((p1, i) => {
    const p2 = room.points[(i + 1) % room.points.length];
    const s1 = gridToScreen(p1.gx, p1.gy), s2 = gridToScreen(p2.gx, p2.gy);
    const dx = s2.x - s1.x, dy = s2.y - s1.y;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    let t = ((screenX - s1.x) * dx + (screenY - s1.y) * dy) / (len * len);
    const marginRatio = Math.min(0.35, 18 / len);
    t = Math.max(marginRatio, Math.min(1 - marginRatio, t));
    const px = s1.x + dx * t, py = s1.y + dy * t;
    const dist = Math.hypot(screenX - px, screenY - py);
    if (dist < bestDist) { bestDist = dist; best = { edge: i, ratio: t }; }
  });
  return best;
}

// 生のポインタ位置(sx,sy)が、指定した辺(壁)を挟んでどちら側にあるかを
// 符号付きで返す(正=室内側、負=壁の外側)。drawDoorMarkの既定の法線
// (室内側へ90度)と同じ向きの基準を使い、建具のドラッグ移動中に指を部屋の
// 内側/外側どちらへ動かしたかで内開き/外開きを切り替えるために使う。
function pointerSideOfEdge(room, edgeIndex, sx, sy) {
  const p1 = room.points[edgeIndex];
  const p2 = room.points[(edgeIndex + 1) % room.points.length];
  const s1 = gridToScreen(p1.gx, p1.gy), s2 = gridToScreen(p2.gx, p2.gy);
  const dx = s2.x - s1.x, dy = s2.y - s1.y;
  const len = Math.hypot(dx, dy);
  if (len === 0) return 1;
  const ux = dx / len, uy = dy / len;
  const nx = -uy, ny = ux; // 室内側への法線(drawDoorMarkの既定と同じ向き)
  return (sx - s1.x) * nx + (sy - s1.y) * ny;
}

const VERTEX_SNAP_DIST_MASU = 0.4; // 既存の頂点にスナップする許容距離(グリッド単位、1/1モード時)
// 1/2,1/3...等の細かいモードでは、この距離が粗すぎると細かい位置調整が
// 既存の遠い頂点に引っ張られてしまうため、細かさに応じて許容距離を縮める。
function vertexSnapDist() { return Math.min(VERTEX_SNAP_DIST_MASU, 0.6 / snapDenom); }
// 新しく確定しようとしている頂点(g)が、既存の別の部屋の頂点に近ければそちらへ
// 吸着させる。隣接して部屋を描いた際に隙間や半端なズレが出ず、ぴったり接した
// 見た目になる(完全な壁の共有ではないが、見た目の質はこれで十分改善できる)。
// excludeRoomを指定すると、その部屋自身の頂点は候補から除外する(頂点編集時用)。
function snapToExistingVertex(g, excludeRoom) {
  let best = null, bestDist = vertexSnapDist();
  for (const room of state.rooms) {
    if (room === excludeRoom) continue;
    for (const p of room.points) {
      const d = Math.hypot(p.gx - g.gx, p.gy - g.gy);
      if (d < bestDist) { bestDist = d; best = { gx: p.gx, gy: p.gy }; }
    }
  }
  return best || g;
}

function isNearFirstPoint(candidate) {
  const first = drawingPoints[0];
  const a = gridToScreen(first.gx, first.gy);
  const b = gridToScreen(candidate.gx, candidate.gy);
  return Math.hypot(a.x - b.x, a.y - b.y) <= CLOSE_DIST_PX;
}

/* ---------------- ポインタ操作(パン/ズーム + なぞり描き) ---------------- */
const pointers = new Map(); // pointerId -> {x,y}
let pinch = null;
let pendingSingleTouch = null; // {timer, pointerId, sx, sy}

function startPinch() {
  if (pendingSingleTouch) { clearTimeout(pendingSingleTouch.timer); pendingSingleTouch = null; }
  isPointerDrawing = false;
  const pts = [...pointers.values()];
  const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  pinch = { startDist: dist, startScale: view.scale, startMid: mid, startOff: { x: view.offX, y: view.offY } };
}

drawCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { drawCanvas.setPointerCapture(e.pointerId); } catch (err) { /* 合成イベント等では失敗することがあるため無視 */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) { startPinch(); return; }
  if (pointers.size > 2) return;

  const rect = drawCanvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const pid = e.pointerId;
  const timer = setTimeout(() => {
    pendingSingleTouch = null;
    if (!pointers.has(pid) || pointers.size !== 1) return;
    handleSingleTouchStart(sx, sy);
  }, 90);
  pendingSingleTouch = { timer, pointerId: pid, sx, sy };
});

// 部屋本体の内側でも、ふちに近すぎる位置は「隣接する部屋を隙間なく描き足したい」
// タップの可能性が高いため、新規選択の対象からは除外する(既に選択中の部屋を
// 再確認するタップには影響しない)。距離は画面px単位。
const EDGE_SELECT_MARGIN_PX = 10;
function distanceToNearestEdge(room, sx, sy) {
  let best = Infinity;
  room.points.forEach((p1, i) => {
    const p2 = room.points[(i + 1) % room.points.length];
    const s1 = gridToScreen(p1.gx, p1.gy), s2 = gridToScreen(p2.gx, p2.gy);
    const dx = s2.x - s1.x, dy = s2.y - s1.y;
    const len2 = dx * dx + dy * dy;
    let t = len2 === 0 ? 0 : ((sx - s1.x) * dx + (sy - s1.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = s1.x + dx * t, py = s1.y + dy * t;
    best = Math.min(best, Math.hypot(sx - px, sy - py));
  });
  return best;
}

let lastTapWasDeselect = false; // 直前のタップが「選択解除」だったか(なぞり描き開始と同時に判定するため)
let drawStartWasDeselectTap = false; // 今回の描画開始が「選択解除に伴うついで」だったか(endPointerで参照)

// 【プランA】「描く/編集」ツール統合: 既存部屋の中をタップしたら選択(頂点・設備
// ハンドル表示)、何もない場所をタップしたら新規描画、という判定を共通化する。
// 戻り値true = このタップは選択/解除/ハンドル操作として処理済み(呼び出し元は
// 新規描画を始めない)。false = 何もない場所へのタップ(呼び出し元は新規描画を始めてよい)。
function tryRoomSelectionTap(sx, sy) {
  lastTapWasDeselect = false;
  if (editingRoom) {
    const hIdx = hitTestVertexHandle(editingRoom, sx, sy);
    if (hIdx !== null) {
      snapshot();
      vertexDrag = { room: editingRoom, index: hIdx };
      render();
      return true;
    }
    if (hitTestFixtureRotateHandle(editingRoom, sx, sy)) {
      snapshot();
      fixtureRotateDrag = { room: editingRoom };
      render();
      return true;
    }
    if (hitTestFixtureHandle(editingRoom, sx, sy)) {
      snapshot();
      fixtureDrag = { room: editingRoom };
      render();
      return true;
    }
  }
  const w = screenToGridRaw(sx, sy);
  const room = hitTestRoom(w.gx, w.gy);
  if (room) {
    if (editingRoom === room) {
      // 選択中の部屋をもう一度タップ → 種別/畳数の編集メニューを開く(ふちに近くても常に許可)
      openRoomEditor(room);
      return true;
    }
    // 新規選択の場合のみ、ふちに近すぎるタップは「隣の部屋を描きたい」可能性を優先する
    if (distanceToNearestEdge(room, sx, sy) < EDGE_SELECT_MARGIN_PX) {
      if (editingRoom) { editingRoom = null; render(); return true; }
      return false;
    }
    editingRoom = room;
    render();
    showHint(roomHasFixture(room)
      ? "頂点をドラッグで形を調整、点線の丸(設備アイコン)をドラッグで位置を、先の小さい丸をドラッグで向きを調整できます"
      : "頂点をドラッグで形を調整できます。もう一度タップすると編集メニューが開きます");
    return true;
  }
  if (editingRoom) {
    // 選択解除は行うが、このタップ自体は「空いた場所への新規描画」として
    // そのまま進める(= return falseで呼び出し元に処理を戻す)。
    // 一度「解除専用」にする案も試したが、それだと「部屋を編集した直後に
    // 続けて次の部屋を描く」という最も頻繁な一連の操作が、1回のドラッグでは
    // 素通りしてしまう(解除だけで描画が始まらない)という深刻な回帰を生んだため、
    // 元の「解除しつつそのまま描画开始」に戻す。
    // ただし、指を動かさずにただ離しただけ(=本当にただの解除タップだった)の
    // 場合は、endPointer側で自動的にこの1点だけの描画をキャンセルする
    // (lastTapWasDeselectで区別する。実際に指を動かして描こうとした場合は
    // そのまま通常通り描画が続く)。
    editingRoom = null;
    render();
    lastTapWasDeselect = true;
  }
  return false;
}

function handleSingleTouchStart(sx, sy) {
  if (currentTool === "door") {
    const existing = hitTestExistingDoor(sx, sy);
    if (existing) {
      // タップだけなら編集モーダル、そのままドラッグすれば壁沿いに移動、の
      // どちらにもなれるよう、まずは「ドラッグ開始候補」として保持しておく
      // (実際に動いたかどうかはpointermove/endPointer側で判定して分岐する)。
      snapshot();
      doorDrag = { room: existing.room, doorIndex: existing.index, moved: false };
      render();
      return;
    }
    for (let i = state.rooms.length - 1; i >= 0; i--) {
      const hit = hitTestEdge(state.rooms[i], sx, sy);
      if (hit) { openDoorAddModal(state.rooms[i], hit); return; }
    }
    showHint("部屋の壁の近くをタップしてください");
    return;
  }
  // 描く/編集ツール: 何も描いていない状態でのタップは、まず「既存部屋の選択」を試す。
  // 部屋の中をタップしたら選択、何もない場所なら新規描画に進む。
  const isFreshTap = drawingPoints.length === 0;
  if (isFreshTap && tryRoomSelectionTap(sx, sy)) return;
  // なぞり描き開始(または続きの描画開始)
  if (isFreshTap) drawStartWasDeselectTap = lastTapWasDeselect;
  isPointerDrawing = true;
  dragAxis = null;
  lastRawPos = null;
  if (drawingPoints.length === 0) {
    const g = snapToExistingVertex(screenToGridSnapped(sx, sy));
    drawingPoints.push(g);
    // 選択解除のついでに始まった描画の場合、実際に指を動かすまでは「描画中」の
    // 表示(バー・ヒント)を出さない(ただの解除タップで一瞬フラッシュするのを防ぐ)。
    // 動かせば下のupdateNazoriDragで表示される。何もない場所への素の新規描画は
    // 従来通り即座に表示する。
    if (!drawStartWasDeselectTap) {
      $("drawingBar").classList.add("show");
      showHint("そのまま指を動かすと壁が直角に伸びます。指を動かさずタップだけすると、その位置に斜めの頂点を置けます", true);
    }
    previewPoint = g;
  } else {
    // 続きの描画: ここではまだ「なぞる(ドラッグ)」か「置くだけ(タップ)」か分からないため、
    // ひとまずタップした位置をそのまま次の頂点候補にしておく。この後に実際へ指を
    // 動かせばupdateNazoriDragが直角スナップ済みの値で上書きするが、動かさずに
    // 指を離した場合はここで置いた座標がそのまま確定する(=なぞらなくても、
    // タップだけで斜めの頂点を置けるようにするための分岐)。
    previewPoint = snapToExistingVertex(screenToGridSnapped(sx, sy));
  }
  render();
}

drawCanvas.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2 && pinch) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    const newScale = Math.max(0.4, Math.min(3, pinch.startScale * (dist / pinch.startDist)));
    const rect = drawCanvas.getBoundingClientRect();
    const midLocal = { x: mid.x - rect.left, y: mid.y - rect.top };
    const startMidLocal = { x: pinch.startMid.x - rect.left, y: pinch.startMid.y - rect.top };
    const worldAtStart = { x: (startMidLocal.x - pinch.startOff.x) / pinch.startScale, y: (startMidLocal.y - pinch.startOff.y) / pinch.startScale };
    view.scale = newScale;
    view.offX = midLocal.x - worldAtStart.x * newScale;
    view.offY = midLocal.y - worldAtStart.y * newScale;
    drawGrid(); render();
    return;
  }

  if (vertexDrag && pointers.size === 1) {
    const rect = drawCanvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const g = snapToExistingVertex(screenToGridSnapped(sx, sy), vertexDrag.room);
    vertexDrag.room.points[vertexDrag.index] = g;
    render();
    return;
  }

  if (fixtureDrag && pointers.size === 1) {
    const rect = drawCanvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const raw = screenToGridRaw(sx, sy);
    const room = fixtureDrag.room;
    const xs = room.points.map((p) => p.gx), ys = room.points.map((p) => p.gy);
    const pad = 0.15;
    const candidate = {
      gx: Math.max(Math.min(...xs) + pad, Math.min(Math.max(...xs) - pad, raw.gx)),
      gy: Math.max(Math.min(...ys) + pad, Math.min(Math.max(...ys) - pad, raw.gy)),
    };
    // L字等の凹型の部屋では、外接矩形の範囲内でも実際には部屋の外(欠けた角)に
    // あたる位置があるため、実際に多角形の内側にある時だけ位置を更新する
    // (壁に当たって止まるような感覚で、部屋の外へは出せないようにする)。
    if (isPointInPolygonGrid(candidate.gx, candidate.gy, room.points)) {
      room.fixturePos = candidate;
      render();
    }
    return;
  }

  if (fixtureRotateDrag && pointers.size === 1) {
    const rect = drawCanvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const room = fixtureRotateDrag.room;
    const c = gridToScreen(fixtureGridPos(room).gx, fixtureGridPos(room).gy);
    const angleDeg = (Math.atan2(sy - c.y, sx - c.x) * 180) / Math.PI + 90;
    const snapped = Math.round(angleDeg / 15) * 15;
    room.fixtureRotation = ((snapped % 360) + 360) % 360;
    render();
    return;
  }

  if (doorDrag && pointers.size === 1) {
    const rect = drawCanvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const room = doorDrag.room;
    const hit = hitTestEdgeForDrag(room, sx, sy);
    if (hit) {
      // 同じ壁上の他の建具に近づきすぎる位置には移動させない(新規追加時と同じ制約)
      const tooClose = room.doors.some((d, i) => i !== doorDrag.doorIndex && d.edge === hit.edge && Math.abs(d.ratio - hit.ratio) < MIN_RATIO_GAP);
      if (!tooClose) {
        const door = room.doors[doorDrag.doorIndex];
        door.edge = hit.edge;
        door.ratio = hit.ratio;
        // 開き戸(hinge/hinge_double)は、生の指位置が壁のどちら側にあるかで
        // 内開き/外開きを決める。部屋の内側へドラッグすれば内開き、壁を
        // 越えて外側(隣室・屋外側)へドラッグすれば外開きに切り替わる。
        if (door.type === "hinge" || door.type === "hinge_double") {
          door.swingOut = pointerSideOfEdge(room, hit.edge, sx, sy) < 0;
        }
        doorDrag.moved = true;
        render();
      }
    }
    return;
  }

  if (!isPointerDrawing || pointers.size !== 1) return;
  const rect = drawCanvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  updateNazoriDrag(sx, sy);
});

// なぞり描き: 判定は必ず「直近に判定を行った、生の(丸めていない)ポインタ位置」
// (lastRawPos)からの新たな移動だけを見る。previewPoint(グリッドにスナップ済み
// の座標)を基準にすると、そのスクリーン座標が実際の指位置とわずかにズレて
// おり、そのズレが新しい移動の度に「直交方向への動き」として誤検出され、
// 一直線に動かしているだけで1マスごとに頂点が確定してしまう不具合があった。
// 生のポインタ位置同士の差分だけを見ることで、この誤検出を避ける。
function updateNazoriDrag(sx, sy) {
  if (!lastRawPos) lastRawPos = { x: sx, y: sy };
  const dx = sx - lastRawPos.x, dy = sy - lastRawPos.y;
  const dist = Math.hypot(dx, dy);
  if (dist < AXIS_THRESHOLD_PX) return; // まだ確定判断できるほど動いていない

  // 選択解除のついでの描画開始で、表示を保留していた場合、実際に動いたのでここで表示する
  if (!$("drawingBar").classList.contains("show")) {
    $("drawingBar").classList.add("show");
    showHint("そのまま指を動かすと壁が伸び、曲げると角ができます。離すと一区切りします", true);
  }

  const axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  lastRawPos = { x: sx, y: sy }; // 判定基準を更新(誤差の蓄積を防ぐ)

  const anchor = drawingPoints[drawingPoints.length - 1];
  if (dragAxis !== null && axis !== dragAxis) {
    // 直交方向へ閾値以上動いた = 方向転換。今まで伸びていたpreviewPointを頂点として確定
    if (previewPoint && !(previewPoint.gx === anchor.gx && previewPoint.gy === anchor.gy)) {
      drawingPoints.push(snapToExistingVertex(previewPoint));
    }
    dragAxis = null;
  }
  dragAxis = axis;

  const newAnchor = drawingPoints[drawingPoints.length - 1];
  const anchorScreen = gridToScreen(newAnchor.gx, newAnchor.gy);
  if (axis === "x") {
    const gxRaw = screenToGridRaw(sx, anchorScreen.y).gx;
    previewPoint = { gx: snapCoord(gxRaw), gy: newAnchor.gy };
  } else {
    const gyRaw = screenToGridRaw(anchorScreen.x, sy).gy;
    previewPoint = { gx: newAnchor.gx, gy: snapCoord(gyRaw) };
  }
  render();
}

// なぞり中、指を離す直前の最後のひと動きがAXIS_THRESHOLD_PX未満だと
// updateNazoriDragの閾値判定に引っかからず反映されないまま指が離れてしまう。
// 通常のスナップ(1/1)なら誤差が丸めで吸収され気付きにくいが、細かいスナップ
// (1/3〜1/8)では最終座標がスナップ1刻み分手前でズレて確定することがあった。
// 指を離す瞬間、今の軸(dragAxis)方向にだけ最新の生座標を反映させて解消する
// (方向転換の判定はしない。あくまで同じ軸上の最後の微調整のみ)。
function flushFinalDragPosition(sx, sy) {
  if (!dragAxis || !previewPoint) return;
  const anchor = drawingPoints[drawingPoints.length - 1];
  const anchorScreen = gridToScreen(anchor.gx, anchor.gy);
  if (dragAxis === "x") {
    const gxRaw = screenToGridRaw(sx, anchorScreen.y).gx;
    previewPoint = { gx: snapCoord(gxRaw), gy: anchor.gy };
  } else {
    const gyRaw = screenToGridRaw(anchorScreen.x, sy).gy;
    previewPoint = { gx: anchor.gx, gy: snapCoord(gyRaw) };
  }
}

// なぞる(ドラッグ)場合と、タップだけ(斜めの頂点を置く)場合の両方で、指を離した
// 時点のpreviewPointを実際の頂点として確定する共通処理。タップの場合は
// (pendingSingleTouchの早期returnがあるため)endPointer冒頭からも、ドラッグの
// 場合は末尾からも、どちらからも呼ばれるようにして処理を一本化している。
function commitPendingVertexOnRelease(sx, sy) {
  if (!(isPointerDrawing && currentTool === "wall")) return;
  if (typeof sx === "number") flushFinalDragPosition(sx, sy);
  isPointerDrawing = false;
  dragAxis = null; lastRawPos = null;
  if (!previewPoint) return;
  const last = drawingPoints[drawingPoints.length - 1];
  const isNewPoint = !(previewPoint.gx === last.gx && previewPoint.gy === last.gy);
  // 「選択解除のついでに始まった描画」で、かつ指を全く動かさずに離した(=ただの
  // 解除タップだった)場合は、この1点だけの描画を自動でキャンセルする。
  // 実際に指を動かして次の頂点まで伸ばした場合、あるいはタップで新しい頂点を
  // 置いた場合(isNewPoint)は、通常通り描画を続ける。
  if (!isNewPoint && drawStartWasDeselectTap && drawingPoints.length === 1) {
    drawStartWasDeselectTap = false;
    cancelDrawing();
    return;
  }
  drawStartWasDeselectTap = false;
  if (isNewPoint && drawingPoints.length >= 3 && isNearFirstPoint(previewPoint)) {
    finishRoom();
    return;
  }
  if (isNewPoint) drawingPoints.push(snapToExistingVertex(previewPoint));
  previewPoint = null;
  render();
}

// 頂点/設備アイコン/建具の各ドラッグ状態を、指を離した時点で確定させる共通処理。
// タップ後すぐ離した場合(pendingSingleTouchの早期return)・通常のドラッグ完了
// の両方から呼べるよう一本化してある。該当するドラッグが無ければfalseを返す。
function finalizeActiveDrags() {
  if (vertexDrag) {
    const room = vertexDrag.room;
    room.tatami = masuToTatami(polygonAreaMasu(room.points));
    vertexDrag = null;
    render(); autoSave();
    syncStairToOtherFloors(room);
    return true;
  }
  if (fixtureDrag) {
    fixtureDrag = null;
    render(); autoSave();
    return true;
  }
  if (fixtureRotateDrag) {
    fixtureRotateDrag = null;
    render(); autoSave();
    return true;
  }
  if (doorDrag) {
    const { room, doorIndex, moved } = doorDrag;
    doorDrag = null;
    if (!moved) {
      // 実質ドラッグしていない(=ただのタップだった)場合は、従来通り編集モーダルを開く
      openDoorEditModal(room, doorIndex);
      return true;
    }
    const interference = hasDoorInterference();
    render(); autoSave();
    if (interference) {
      showHint("建具同士が開く向きで干渉している可能性があります。種類や向きを見直してください", true);
    }
    return true;
  }
  return false;
}

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pendingSingleTouch && pendingSingleTouch.pointerId === e.pointerId) {
    clearTimeout(pendingSingleTouch.timer);
    const { sx, sy } = pendingSingleTouch;
    pendingSingleTouch = null;
    if (pointers.size === 0) {
      handleSingleTouchStart(sx, sy);
      if (finalizeActiveDrags()) return;
      commitPendingVertexOnRelease();
    }
    return;
  }
  if (pointers.size < 2) pinch = null;

  if (pointers.size === 0 && finalizeActiveDrags()) return;

  if (pointers.size === 0) {
    const rect = drawCanvas.getBoundingClientRect();
    commitPendingVertexOnRelease(e.clientX - rect.left, e.clientY - rect.top);
  }
}
drawCanvas.addEventListener("pointerup", endPointer);
drawCanvas.addEventListener("pointercancel", endPointer);

function cancelDrawing() {
  drawingPoints = []; previewPoint = null; isPointerDrawing = false; dragAxis = null; lastRawPos = null;
  $("drawingBar").classList.remove("show");
  render();
}
function undoLastPoint() {
  if (drawingPoints.length > 1) drawingPoints.pop();
  else if (drawingPoints.length === 1) { cancelDrawing(); return; }
  previewPoint = null; dragAxis = null; lastRawPos = null;
  render();
}
$("btnCancelDrawing").addEventListener("click", cancelDrawing);
$("btnUndoPoint").addEventListener("click", undoLastPoint);
$("btnFinishRoom").addEventListener("click", () => {
  if (drawingPoints.length >= 3) finishRoom();
});

function finishRoom() {
  const points = simplifyRoomPoints(drawingPoints);
  drawingPoints = []; previewPoint = null; dragAxis = null; lastRawPos = null;
  $("drawingBar").classList.remove("show");
  const masu = polygonAreaMasu(points);
  if (masu < 0.5) {
    // 自己交差した形や小さすぎる形は部屋として確定できない。無言で握りつぶすと
    // 「反応がない」ように見えて分かりにくいため、理由をヒントで伝える。
    showHint("形が小さすぎるか、線が交差しています。もう少し大きく描き直してください");
    render();
    return;
  }
  pendingRoom = { points, masu };
  editingRoom = null;
  openRoomTypeModal(false);
}

// 表示用に丸めて末尾の余計な0を削る(6.00→6, 6.50→6.5, 6.25はそのまま)
function formatTatami(v) { return String(Math.round(v * 100) / 100); }
const DEFAULT_STEP_COUNT = 14; // 一般的な住宅の階段1層あたりの段数の目安
function openTatamiModal(type, tatami, sourceText, isEdit) {

function stepStepCount(delta) {

  $("tatamiModal").dataset.stepCount = v;

}
function confirmTatami() {

  } else {

    room = { id: Date.now(), points: pendingRoom.points, typeKey: pendingRoom.typeKey, tatami: v, doors: [] };
    if (isStair) room.stepCount = stepCount;
    state.rooms.push(room);
    pendingRoom = null;
  }
  hideModal("tatamiModal");
  render(); autoSave();
  syncStairToOtherFloors(room);
}

/* ---------------- 方位コンパス(ドラッグで回転) ---------------- */
const compassEl = $("compass");
const compassRotor = $("compassRotor");
function updateCompassVisual() {
  compassRotor.style.transform = `rotate(${state.northAngle}deg)`;
}
function angleFromCenter(cx, cy, px, py) {
  const dx = px - cx, dy = py - cy;
  let angle = Math.atan2(dx, -dy) * (180 / Math.PI); // 真上を0度、時計回りに正規化
  if (angle < 0) angle += 360;
  return angle;
}
let compassDragging = false;
let compassStartAngle = 0, compassStartNorth = 0;
compassEl.addEventListener("pointerdown", (e) => {
  e.preventDefault(); e.stopPropagation();
  compassDragging = true;
  try { compassEl.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
  compassEl.style.cursor = "grabbing";
  const rect = compassEl.getBoundingClientRect();
  compassStartAngle = angleFromCenter(rect.left + rect.width / 2, rect.top + rect.height / 2, e.clientX, e.clientY);
  compassStartNorth = state.northAngle;
});
compassEl.addEventListener("pointermove", (e) => {
  if (!compassDragging) return;
  e.stopPropagation();
  const rect = compassEl.getBoundingClientRect();
  const cur = angleFromCenter(rect.left + rect.width / 2, rect.top + rect.height / 2, e.clientX, e.clientY);
  const delta = cur - compassStartAngle;
  state.northAngle = (compassStartNorth + delta + 360) % 360;
  updateCompassVisual();
});
function endCompassDrag(e) {
  if (!compassDragging) return;
  compassDragging = false;
  compassEl.style.cursor = "grab";
  // 15度刻みにスナップ(細かい調整がしたい場合は微妙にズレたままでも実用上問題ない範囲)
  state.northAngle = Math.round(state.northAngle / 15) * 15 % 360;
  updateCompassVisual();
  autoSave();
  syncNorthAngleToOtherFloors();
}
compassEl.addEventListener("pointerup", endCompassDrag);
compassEl.addEventListener("pointercancel", endCompassDrag);

  if (key === "hinge_double") return `<svg ${common}><path d="M6 30 L54 30" stroke="#c7ced6" stroke-width="2"/><path d="M6 30 L6 8" stroke="#1c2733" stroke-width="1.6" fill="none"/><path d="M6 30 A22 22 0 0 0 28 8" stroke="#1c2733" stroke-width="1.2" fill="none"/><path d="M54 30 L54 8" stroke="#1c2733" stroke-width="1.6" fill="none"/><path d="M54 30 A22 22 0 0 1 32 8" stroke="#1c2733" stroke-width="1.2" fill="none"/></svg>`;
  if (key === "slide") return `<svg ${common}><path d="M2 12 L54 12" stroke="#1c2733" stroke-width="1.4"/><path d="M2 22 L54 22" stroke="#1c2733" stroke-width="1.4"/><path d="M2 12 L-6 12 M2 22 L-6 22" stroke="#1c2733" stroke-width="1.4" stroke-dasharray="2,2" transform="translate(8,0)"/></svg>`;
  if (key === "slide_double") return `<svg ${common}><path d="M6 12 L54 12" stroke="#1c2733" stroke-width="1.4"/><path d="M6 22 L54 22" stroke="#1c2733" stroke-width="1.4"/></svg>`;

}

function openDoorAddModal(room, hit) {
  const doors = room.doors || [];
  const tooClose = doors.some((d) => d.edge === hit.edge && Math.abs(d.ratio - hit.ratio) < MIN_RATIO_GAP);
  if (tooClose) {
    showHint("近くに建具があります。少し離してタップしてください");
    return;
  }
  // 直前に選んだ建具の種類・大きさを次回の初期値として引き継ぐ(同じ種類の建具を
  // 連続して付ける場面で、毎回種類を選び直さずそのまま「これで確定」だけで
  // 済むようにするため)。
  // 新規に付ける建具は常に内開き(swingOut:false)から始まる。内開き/外開きの
  // 切り替えはボタンではなく、既存の建具をドラッグで移動する操作の中で
  // (壁のどちら側へ動かしたかに応じて)行う仕様のため。
  pendingDoor = { room, edge: hit.edge, ratio: hit.ratio, existingIndex: -1, type: lastDoorType, widthMasu: lastDoorWidthMasu, flip: lastDoorFlip, swingOut: false };
  $("doorModalTitle").textContent = "建具の種類";
  $("btnDeleteDoor").style.display = "none";
  updateDoorModalUI();
  showModal("doorTypeModal");
}

// 幅の調整単位は0.1マス(≒9cm)刻み。壁からはみ出さないよう、その壁の長さの
// 90%を上限にクランプする(新規追加時はhit.edge、既存編集時は現在のedgeを使う)。
function pendingDoorEdgeLenMasu() {
  const edge = pendingDoor.existingIndex >= 0 ? pendingDoor.room.doors[pendingDoor.existingIndex].edge : pendingDoor.edge;
  const p1 = pendingDoor.room.points[edge];
  const p2 = pendingDoor.room.points[(edge + 1) % pendingDoor.room.points.length];
  return Math.hypot(p2.gx - p1.gx, p2.gy - p1.gy);
}
function stepDoorWidth(delta) {
  const maxW = Math.max(0.3, pendingDoorEdgeLenMasu() * 0.9);
  pendingDoor.widthMasu = Math.max(0.3, Math.min(maxW, Math.round((pendingDoor.widthMasu + delta) * 10) / 10));
  updateDoorModalUI();
}
// 開き戸(hinge/hinge_double)の振れ込み範囲(グリッド単位)を、実際の描画
// (drawDoorMark)と同じ幅(door.widthMasu、実寸換算の絶対値)を使って求める。
// これにより見た目の建具幅と干渉判定の振れ込み半径が常に一致する。
// 引き戸・窓は振れ込まないため対象外。
function getDoorSwingWorld(room, door) {
  if (door.type !== "hinge" && door.type !== "hinge_double") return null;
  const p1 = room.points[door.edge];
  const p2 = room.points[(door.edge + 1) % room.points.length];
  const edgeLen = Math.hypot(p2.gx - p1.gx, p2.gy - p1.gy);
  if (edgeLen < 0.01) return null;
  const ux = (p2.gx - p1.gx) / edgeLen, uy = (p2.gy - p1.gy) / edgeLen;
  const center = { gx: p1.gx + ux * edgeLen * door.ratio, gy: p1.gy + uy * edgeLen * door.ratio };
  const doorWidth = Math.max(0.2, Math.min(door.widthMasu || 0.85, edgeLen * 0.9));
  const a = { gx: center.gx - ux * doorWidth / 2, gy: center.gy - uy * doorWidth / 2 };
  const b = { gx: center.gx + ux * doorWidth / 2, gy: center.gy + uy * doorWidth / 2 };
  const hinge = door.flip ? b : a;
  return { hinge, radius: doorWidth };
}
// 同じ部屋の中にある開き戸同士で、振れ込み範囲(円で近似)が重なっている
// ものが無いか調べる。実寸化(建具幅を実際のwidthMasu基準にした)により
// 振れ込み半径が大きくなったため、部屋をまたいだ比較のまま(=別の部屋へ
// 開く建具同士は本来干渉しないのに)にすると、水回りが密集した間取りで
// 隣接する別々の部屋の建具まで誤って干渉扱いになってしまう不具合があった。
// 同じ部屋の中で開く建具同士だけを対象にすることで、この誤検知を防ぐ
// (警告のみで配置自体は妨げない)。外開きの建具は、この部屋自身の内側では
// なく壁の外側(隣室・屋外側)へ振れ込むため、同室内の他の建具との比較対象
// からは除外する(本来別の空間で振れ込むので、単純な距離比較は意味を持たない)。
function hasDoorInterference() {
  for (const room of state.rooms) {
    const swings = (room.doors || [])
      .filter((door) => !isOutwardHingeDoor(door))
      .map((door) => getDoorSwingWorld(room, door))
      .filter(Boolean);
    for (let i = 0; i < swings.length; i++) {
      for (let j = i + 1; j < swings.length; j++) {
        const a = swings[i], b = swings[j];
        const dist = Math.hypot(a.hinge.gx - b.hinge.gx, a.hinge.gy - b.hinge.gy);
        // 半径の合計より明確に近い場合のみ警告する(僅かな近接は許容)
        if (dist < (a.radius + b.radius) * 0.85) return true;
      }
    }
  }
  return false;
}
