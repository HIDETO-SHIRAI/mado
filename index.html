<style>
  :root {
    --accent: #2f6fed;
    --danger: #e2492c;
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #1c2733;
    --muted: #7c8996;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  #app.app-hidden { display: none !important; }

  /* ---- ログイン画面 ---- */
  #loginGate .page-body { justify-content: center; gap: 10px; }
  #loginGate h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  #loginGate .login-sub { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 18px; }
  #loginGate .login-divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 14px 0; }
  #loginGate .login-divider::before, #loginGate .login-divider::after { content: ""; flex: 1; height: 1px; background: #e3e8ee; }
  #loginGate .login-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.6; }
  /* .btnのflex:1は横並びの.modal-actions前提。#loginGateの.page-bodyは
     縦方向のflexコンテナのため、そのまま置くと縦に伸びてしまう。固定させる。 */
  #loginGate .btn.google { flex: 0 0 auto; width: 100%; }
  #loginGate .input-error { min-height: 18px; }
  .link-btn {
    background: none; border: none; color: var(--accent); font-size: 13px;
    padding: 4px 2px; align-self: flex-start; flex: 0 0 auto; text-decoration: underline;
  }

  /* ---- 上部バー ---- */
  #topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px; background: var(--panel);
    border-bottom: 1px solid #e3e8ee; flex-shrink: 0;
  }
  #projectTitle { font-size: 14px; margin: 0; flex: 1; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn {
    border: none; background: #eef1f5; color: var(--text);
    min-width: 40px; height: 44px; border-radius: 10px; font-size: 16px;
    padding: 3px 3px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; flex-shrink: 0;
  }
  .iconbtn .cap { font-size: 9px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .iconbtn:active { background: #dfe4ea; }
  .iconbtn[disabled] { opacity: .35; }
  /* undo/redoは押し間違いの被害が大きい(直前の操作が消える)ため、他のアイコンより
     視認性を上げて位置がすぐ分かるようにする */
  .iconbtn.emphasis { background: #eef3ff; border: 1.5px solid #c7d7ff; }
  #btnSnapMode { width: auto; padding: 0 10px; gap: 3px; font-size: 13px; font-weight: 700; }
  #btnSnapMode .em { font-size: 15px; }

  /* ---- キャンバス領域 ---- */
  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #fff; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; }

  #compass {
    position: absolute; top: 8px; right: 8px;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,.96); box-shadow: 0 1px 4px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: grab;
  }
  #compassRotor {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #compassRotor .arrow { position: absolute; top: 3px; font-size: 10px; color: var(--danger); }
  #compassRotor span { margin-top: 9px; font-size: 13px; font-weight: 700; color: var(--text); }

  /* ---- 部屋合計表示(常時) ---- */
  #totals {
    position: absolute; left: 8px; bottom: 8px;
    background: rgba(255,255,255,.98); border-radius: 10px;
    padding: 6px 10px; font-size: 12px; color: var(--muted);
    box-shadow: 0 1px 5px rgba(0,0,0,.16); pointer-events: none;
  }
  #totals b { color: var(--text); font-size: 13px; }

  #zoomHint {
    position: absolute; right: 8px; bottom: 8px;
    background: rgba(255,255,255,.98); border-radius: 10px;
    padding: 6px 10px; font-size: 11px; color: var(--muted);
    box-shadow: 0 1px 5px rgba(0,0,0,.16); pointer-events: none;
  }

  /* ---- 描画中の操作バー(浮動・半透明) ---- */
  #drawingBar {
    position: absolute; left: 50%; top: 54px; transform: translateX(-50%);
    display: none; gap: 8px; background: rgba(28,39,51,.72); padding: 8px; border-radius: 14px;
    backdrop-filter: blur(2px);
  }
  #drawingBar.show { display: flex; }
  #drawingBar button {
    border: none; border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,.2); color: #fff;
  }
  #drawingBar button.finish { background: var(--accent); }
  #drawingBar button.cancel { background: var(--danger); }
  #drawingBar button[disabled] { opacity: .4; }

  /* ---- 下部ツールバー ---- */
  #toolbar {
    display: flex; gap: 6px; padding: 8px; background: var(--panel);
    border-top: 1px solid #e3e8ee; flex-shrink: 0;
  }
  .tool {
    flex: 1; border: none; background: #eef1f5; color: var(--text);
    padding: 10px 2px; border-radius: 12px; font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tool .em { font-size: 19px; }
  .tool.active { background: var(--accent); color: #fff; }

  /* ---- モーダル共通 ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,26,33,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-overlay.hidden-behind { display: none; }
  .modal {
    background: var(--panel); width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0; padding: 14px 16px 20px;
    max-height: 58vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal h2 { font-size: 15px; margin: 0 0 10px; flex: 0 0 auto; }
  /* 全画面表示の「別ページ」バリエーション。物件一覧は物件数が増えるほど
     項目が増えるため、下から出るシート(高さ58vh制限)ではなく画面全体を
     使う独立した画面として表示する。戻るボタン付きのヘッダーを付ける。 */
  .modal-overlay.fullpage { align-items: stretch; justify-content: stretch; }
  .modal-overlay.fullpage .modal {
    max-width: none; width: 100%; max-height: none; height: 100%;
    border-radius: 0; padding: 0;
  }
  .page-header {
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
    padding: 10px 12px; border-bottom: 1px solid #e3e8ee;
  }
  .page-header h2 { margin: 0; font-size: 16px; flex: 1; }
  .page-body {
    flex: 1 1 auto; display: flex; flex-direction: column;
    overflow: hidden; padding: 12px 16px; min-height: 0;
  }
  .modal-overlay.fullpage .modal-actions { padding: 12px 16px; margin-top: 0; border-top: 1px solid #f0f2f5; }
  /* 部屋種別/建具種別など選択肢が多いグリッドは、見出しと「やめる」等の操作
     ボタンを常に画面内に固定したまま、グリッド部分だけを内側でスクロールさせる。
     こうすることで「ボタンが画面下端で見切れて迷う」という問題を避けられる。 */
  .grid-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .room-type-btn {
    border: 2px solid #e3e8ee; background: #fff; border-radius: 12px;
    padding: 9px 6px; font-size: 12px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; color: var(--text);
  }
  .room-type-btn .em { font-size: 20px; }
  .room-type-btn.selected { border-color: var(--accent); background: #eef3ff; }

  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 2px; border-bottom: 1px solid #f0f2f5; flex: 0 0 auto;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row label { font-size: 14px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 8px; border: none;
    background: #eef1f5; font-size: 18px; color: var(--text);
  }
  .stepper .val { min-width: 64px; text-align: center; font-size: 16px; font-weight: 700; }
  .val small { font-weight: 400; color: var(--muted); font-size: 11px; }
  #tatamiValue {
    width: 64px; text-align: center; font-size: 16px; font-weight: 700; font-family: inherit;
    border: 2px solid #e3e8ee; border-radius: 8px; padding: 4px 2px; color: inherit; background: #fff;
  }
  #tatamiValue:focus { outline: none; border-color: var(--accent); }

  .modal-actions { display: flex; gap: 8px; margin-top: 12px; flex: 0 0 auto; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 13px; font-size: 14px;
    font-weight: 700; background: #eef1f5; color: var(--text);
  }
  .btn.primary { background: var(--accent); color: #fff; }

<script type="module">
/* ============================================================
   Firebase(Auth + Firestore)連携。
   下の巨大な非moduleスクリプト(間取り作図アプリ本体)とは別スコープの
   ES moduleとして、意図的に分離してある(本体の3000行規模のスクリプトへ
   影響を与えず、回帰リスクを抑えるため)。本体からは window.Cloud という
   狭いAPIだけを呼ぶ。

   重要な注意: type="module" のスクリプトは常に「遅延実行」される(通常の
   同期<script>より後、DOM構築後に実行される)。そのため本体スクリプトの
   末尾にある起動処理からこのスクリプトの完了を前提に直接呼び出すことは
   できない(まだ実行されていない可能性がある)。逆に本体スクリプト側の
   関数(showHint/openConfirm等、トップレベルのfunction宣言はwindowに
   自動的に生えるため)は、moduleが実行される時点では既に定義済みである
   ことが保証される(非moduleの同期scriptは常にmoduleより先に実行される
   ため)。この非対称性を踏まえ、本体→Cloud の呼び出しだけ
   "cloud-ready" イベントで待ち合わせる設計にしてある。
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider, signOut, sendPasswordResetEmail,
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDocs, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// Firebaseの apiKey はサーバーの秘密鍵ではなく公開識別子であり、公開リポジトリに
// 含まれていても問題ない(実際のアクセス制御はFirestoreセキュリティルール側で行う)。
const firebaseConfig = {
  apiKey: "AIzaSyCdwD6EGf-Ax2_Na4eEn0dxZ6uvrOXa7p8",
  authDomain: "madori-app-19ee6.firebaseapp.com",
  projectId: "madori-app-19ee6",
  storageBucket: "madori-app-19ee6.firebasestorage.app",
  messagingSenderId: "1093981161464",
  appId: "1:1093981161464:web:ff069b0bbcaa0b9fe4380d",
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
// オフラインでも直前までのデータを読み書きできるよう永続キャッシュを有効化する。
// 内覧現場等、電波の弱い場所でも動作を続けられるようにするため。
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
});

// 旧localStorage形式(移行チェック用)。本体スクリプトの STORAGE_KEY と同じ値。
const LOCAL_STORAGE_KEY = "madori_projects_v2";
const MIGRATED_FLAG_KEY = "madori_migrated_v1";

let currentUid = null;
let allProjectsCache = {}; // { [projectName]: { id, floors } }
let writeChain = Promise.resolve(); // 同一ドキュメントへの書き込み順序を保証する
let debounceTimer = null;
let pendingDiffBase = null; // このバッチの直前スナップショット(差分比較の基準)

function projectsCollectionRef() {
  return collection(db, "users", currentUid, "projects");
}

// Firebase Authのエラーコードを日本語の案内文に変換する。
function mapAuthError(err) {
  const code = err && err.code;
  const table = {
    "auth/invalid-credential": "メールアドレスまたはパスワードが正しくありません",
    "auth/email-already-in-use": "このメールアドレスは既に登録されています。ログインをお試しください",
    "auth/weak-password": "パスワードは6文字以上で入力してください",
    "auth/invalid-email": "メールアドレスの形式が正しくありません",
    "auth/missing-email": "メールアドレスを入力してください",
    "auth/too-many-requests": "試行回数が多すぎます。しばらく待ってからお試しください",
    "auth/network-request-failed": "ネットワークに接続できません。電波の良い場所でお試しください",
    "auth/popup-closed-by-user": "ログインがキャンセルされました",
    "auth/cancelled-popup-request": "ログインがキャンセルされました",
    "auth/account-exists-with-different-credential": "このメールアドレスは別の方法（パスワード等）で登録されています",
    "auth/unauthorized-domain": "このサイトのドメインがFirebase側で未承認のため、Googleログインを利用できません。管理者にご連絡ください",
  };
  if (code && table[code]) return table[code];
  console.error("未対応のFirebase認証エラー:", err);
  return "ログインに失敗しました。もう一度お試しください";
}

// Firestore書き込み失敗時、本体スクリプトの showHint と同じパターンで警告表示する。
function reportCloudError(context, err) {
  console.error(context, err);
  if (typeof window.showHint === "function") {
    window.showHint(`クラウドへの保存に失敗しました(${context})。電波の良い場所で操作をやり直してください`, true);
  }
}

// オフライン中に発行した書き込みは、接続が復旧するまでPromiseが解決されずに
// 待ち続ける(Firestoreの正常な挙動)。ただしwriteChainは前の書き込みの完了を
// 待ってから次を実行する直列キューのため、何らかの理由で1件でも解決しない
// ままになると、それ以降の全ての書き込みが永久にブロックされてしまう。
// 個々の書き込みにタイムアウトを設け、詰まっても後続の書き込みへ進めるようにする。
const WRITE_TIMEOUT_MS = 20000;
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
  ]);
}
function queueWrite(fn, context) {
  writeChain = writeChain.then(() => withTimeout(fn(), WRITE_TIMEOUT_MS)).catch((err) => reportCloudError(context, err));
  return writeChain;
}

// allProjectsCache(前回スナップショットprevと現在next)を プロジェクトID単位・
// フロア単位で比較し、変更分だけをFirestoreへ送る。ドキュメント全体を丸ごと
// 上書きしないのは、他端末が別フロアを編集中に上書きで消してしまう事故を
// 避けるため(フロア単位のドット記法更新なら、他フロアには触れない)。
function dispatchDiff(prev, next) {
  if (!currentUid) return;
  const prevById = {};
  for (const name in prev) { const p = prev[name]; if (p && p.id) prevById[p.id] = { name, floors: p.floors || {} }; }
  const nextIds = new Set();
  for (const name in next) {
    const p = next[name];
    if (!p.id) {
      p.id = crypto.randomUUID();
      // next はallProjectsCacheのJSON複製(使い捨て)なので、ここで生成したIDは
      // 実際のライブキャッシュにも書き戻す。書き戻さないと、次回のcommit()時に
      // 「IDが無い=新規プロジェクト」と誤認識され続け、保存のたびに別IDで
      // Firestore上に重複ドキュメントが増殖するバグになる(実際に発生していた)。
      if (allProjectsCache[name]) allProjectsCache[name].id = p.id;
    }
    nextIds.add(p.id);
  }
  // 削除: prevにあってnextに無いID
  for (const id in prevById) {
    if (!nextIds.has(id)) {
      queueWrite(() => deleteDoc(doc(projectsCollectionRef(), id)), `物件削除:${prevById[id].name}`);
    }
  }
  // 追加・変更・改名
  for (const name in next) {
    const p = next[name];
    const prevEntry = prevById[p.id];
    if (!prevEntry) {
      // 新規プロジェクト: フルセットで作成
      queueWrite(() => setDoc(doc(projectsCollectionRef(), p.id), {
        name, floors: p.floors || {}, updatedAt: serverTimestamp(),
      }), `物件作成:${name}`);
      continue;
    }
    const patch = {};
    let changed = false;
    if (prevEntry.name !== name) { patch.name = name; changed = true; }
    const nextFloors = p.floors || {};
    const prevFloors = prevEntry.floors || {};
    for (const floorName in nextFloors) {
      if (JSON.stringify(prevFloors[floorName]) !== JSON.stringify(nextFloors[floorName])) {
        patch[`floors.${floorName}`] = nextFloors[floorName];
        changed = true;
      }
    }
    for (const floorName in prevFloors) {
      if (!(floorName in nextFloors)) {
        patch[`floors.${floorName}`] = deleteField();
        changed = true;
      }
    }
    if (changed) {
      patch.updatedAt = serverTimestamp();
      queueWrite(() => updateDoc(doc(projectsCollectionRef(), p.id), patch), `物件更新:${name}`);
    }
  }
}

const SYNC_DEBOUNCE_MS = 1800;
function scheduleSync(prevSnapshot) {
  if (!pendingDiffBase) pendingDiffBase = prevSnapshot;
  if (debounceTimer) return;
  debounceTimer = setTimeout(() => {
    const from = pendingDiffBase;
    const to = JSON.parse(JSON.stringify(allProjectsCache));
    pendingDiffBase = null;
    debounceTimer = null;
    dispatchDiff(from, to);
  }, SYNC_DEBOUNCE_MS);
}
function flushSyncNow() {
  if (!debounceTimer) return;
  clearTimeout(debounceTimer);
  debounceTimer = null;
  const from = pendingDiffBase;
  pendingDiffBase = null;
  if (from) dispatchDiff(from, JSON.parse(JSON.stringify(allProjectsCache)));
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSyncNow(); });
window.addEventListener("beforeunload", flushSyncNow);

async function loadAllProjectsFromCloud(uid) {
  currentUid = uid;
  const snap = await getDocs(projectsCollectionRef());
  const cache = {};
  snap.forEach((docSnap) => {
    const data = docSnap.data();
    cache[data.name] = { id: docSnap.id, floors: data.floors || {} };
  });
  allProjectsCache = cache;
}

// 初回ログイン時、既存のlocalStorageデータがありクラウド側が空なら取り込みを提案する。
// btnConfirmCancelは全確認ダイアログ共通のボタンのため、キャンセル検知のために
// 個別のリスナーを付けたりはしない(呼び出し元はこの関数の完了を待たない=
// ユーザーが確認ダイアログにいつ答えるかに関わらず、アプリの起動は先に進める)。
// 「やめる」を選んだ場合は何もせず、次回ログイン時にまた提案するだけでよい。
function migrateLocalDataIfNeeded() {
  if (localStorage.getItem(MIGRATED_FLAG_KEY) === "true") return;
  if (Object.keys(allProjectsCache).length > 0) return; // 既にクラウド側にデータがあれば対象外
  let localAll;
  try { localAll = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)); } catch { localAll = null; }
  const names = localAll ? Object.keys(localAll) : [];
  if (names.length === 0) return;
  if (typeof window.openConfirm !== "function") return;
  window.openConfirm(
    "物件データの取り込み",
    `この端末に保存されている${names.length}件の物件データを、このアカウントに取り込みますか？`,
    async () => {
      try {
        for (const name of names) {
          const id = crypto.randomUUID();
          const floors = (localAll[name] && localAll[name].floors) || {};
          await setDoc(doc(projectsCollectionRef(), id), { name, floors, updatedAt: serverTimestamp() });
          allProjectsCache[name] = { id, floors };
        }
        localStorage.setItem(MIGRATED_FLAG_KEY, "true"); // 成功後にだけフラグを立てる
        if (typeof window.showHint === "function") window.showHint(`${names.length}件の物件をクラウドに移行しました`, true);
        if (typeof window.renderProjectList === "function") window.renderProjectList();
      } catch (err) {
        reportCloudError("移行", err);
      }
    }
  );
}

let readyCallback = null;
let lastUser; // undefined = 未解決
onAuthStateChanged(auth, (user) => {
  lastUser = user;
  if (!user) { currentUid = null; allProjectsCache = {}; }
  if (readyCallback) readyCallback(user);
});

window.Cloud = {
  onReady(cb) {
    readyCallback = cb;
    if (lastUser !== undefined) cb(lastUser);
  },
  getCache() {
    try { return JSON.parse(JSON.stringify(allProjectsCache)); } catch { return {}; }
  },
  commit(data) {
    // 差分比較の基準として保持するprevは、呼び出し側が保持する生の配列
    // (state.rooms等)を後から書き換えても影響を受けないよう、必ず複製する
    // (呼び出し側でのクローン漏れがあっても安全側に倒すための二重の対策)。
    const prev = JSON.parse(JSON.stringify(allProjectsCache));
    allProjectsCache = data;
    scheduleSync(prev);
  },
  loadAllProjectsFromCloud,
  migrateLocalDataIfNeeded,
  mapAuthError,
  async signInEmail(email, password) { return signInWithEmailAndPassword(auth, email, password); },
  async signUpEmail(email, password) { return createUserWithEmailAndPassword(auth, email, password); },
  // ボタンのクリックハンドラから同期的に(awaitを挟まず)呼ぶこと。ポップアップ
  // ブロッカーに引っかからないよう、ユーザー操作の直接の結果である必要がある。
  signInGoogle() { return signInWithPopup(auth, new GoogleAuthProvider()); },
  signOutUser() { return signOut(auth); },
  resetPassword(email) { return sendPasswordResetEmail(auth, email); },
};
window.dispatchEvent(new Event("cloud-ready"));
</script>

<script>
/* ============================================================
   間取りメモ - 簡易作図アプリ (プロトタイプ v3)
   単位ルール: グリッド 2マス = 1畳（1マス = 0.5畳）
   操作: 指を置いて動かすと直線が伸び、曲げるとその場で角が確定する
